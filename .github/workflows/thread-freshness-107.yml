name: ThreadFreshness 1.0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-107.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply 1.0.7
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          root = Path('.')
          addon = root / 'upload/src/addons/WarextStudios/ThreadFreshness'

          # 1) Her uygun kullanıcı kendi mevcut oyunu daha sonra değiştirebilsin.
          thread_path = addon / 'XF/Entity/Thread.php'
          t = thread_path.read_text(encoding='utf-8')
          old = '''        $vote = $this->getWrxtFreshnessVisitorVoteEntity();
          if (!$vote)
          {
              return true;
          }

          $voteDate = max((int)$vote->vote_date, (int)$vote->updated_date);
          if ($voteDate < $this->getWrxtFreshnessReferenceDate())
          {
              return true;
          }

          return $visitor->hasPermission('wrxtFreshness', 'changeVote');'''
          new = '''        // Kullanıcı aynı doğrulama döngüsünde daha önce oy vermiş olsa bile
          // çözümün durumu zamanla değişebileceğinden kendi oyunu güncelleyebilir.
          return true;'''
          if old not in t:
              raise SystemExit('Thread vote-change block not found')
          thread_path.write_text(t.replace(old, new), encoding='utf-8')

          vote_path = addon / 'Service/ThreadFreshness/Vote.php'
          v = vote_path.read_text(encoding='utf-8')
          old = '''            if ($entity)
              {
                  $voteDate = max((int)$entity->vote_date, (int)$entity->updated_date);
                  $isStaleCycleVote = $voteDate < (int)$this->thread->getWrxtFreshnessReferenceDate();
                  if (!$isStaleCycleVote && !$this->user->hasPermission('wrxtFreshness', 'changeVote'))
                  {
                      throw new \\LogicException('Permission denied');
                  }
              }
              else
              {
                  $entity = $em->create('WarextStudios\\ThreadFreshness:Vote');
                  $entity->thread_id = $this->thread->thread_id;
                  $entity->user_id = $this->user->user_id;
              }'''
          new = '''            if (!$entity)
              {
                  $entity = $em->create('WarextStudios\\ThreadFreshness:Vote');
                  $entity->thread_id = $this->thread->thread_id;
                  $entity->user_id = $this->user->user_id;
              }'''
          if old not in v:
              raise SystemExit('Vote service changeVote guard not found')
          vote_path.write_text(v.replace(old, new), encoding='utf-8')

          # 2) Masaüstünde widget başlıkla aynı satırda sağda; mobilde başlığın altında.
          js = """(function () {
              'use strict';
              function placeFreshnessWidget() {
                  var widget = document.getElementById('wrxt-thread-freshness');
                  var title = document.querySelector('.p-title');
                  if (!widget || !title || !title.parentNode) return;

                  var mobile = window.matchMedia && window.matchMedia('(max-width: 650px)').matches;
                  if (mobile) {
                      if (widget.parentNode !== title.parentNode || widget.previousElementSibling !== title) {
                          title.insertAdjacentElement('afterend', widget);
                      }
                      widget.style.width = '100%';
                      widget.style.maxWidth = 'none';
                      widget.style.margin = '7px 0 10px';
                  } else {
                      if (widget.parentNode !== title) {
                          title.appendChild(widget);
                      }
                      widget.style.width = '100%';
                      widget.style.maxWidth = '360px';
                      widget.style.margin = '0 0 0 auto';
                  }
                  widget.dataset.wrxtPlaced = '1';
              }
              if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', placeFreshnessWidget, {once:true});
              else placeFreshnessWidget();
              window.addEventListener('load', placeFreshnessWidget, {once:true});
              window.addEventListener('resize', placeFreshnessWidget);
          }());
          """
          (root / 'upload/js/warext/thread_freshness.js').write_text(js, encoding='utf-8')

          # 3) ACP ikonları XenForo çekirdeğinde kesin bulunan Font Awesome ikonlarıyla değiştir.
          nav_path = addon / '_data/admin_navigation.xml'
          nav_tree = ET.parse(nav_path)
          nav_root = nav_tree.getroot()
          icons = {
              'wrxtThreadFreshness': 'fa-history',
              'wrxtThreadFreshnessDashboard': 'fa-chart-line',
              'wrxtThreadFreshnessForums': 'fa-comments',
              'wrxtThreadFreshnessSettings': 'fa-cog'
          }
          for entry in nav_root.findall('admin_navigation_entry'):
              nav_id = entry.attrib.get('navigation_id')
              if nav_id in icons:
                  entry.attrib['icon'] = icons[nav_id]
          ET.indent(nav_tree, space='  ')
          nav_tree.write(nav_path, encoding='utf-8', xml_declaration=True)

          # 4) Başlık satırı içindeki widget için XF ile uyumlu flex güvenliği.
          templates_path = addon / '_data/templates.xml'
          templates_tree = ET.parse(templates_path)
          templates_root = templates_tree.getroot()
          less = None
          for tpl in templates_root.findall('template'):
              if tpl.attrib.get('type') == 'public' and tpl.attrib.get('title') == 'wrxt_thread_freshness.less':
                  less = tpl
                  break
          if less is None:
              raise SystemExit('LESS template missing')
          extra_css = '@media(min-width:651px){.p-title>.wrxtFreshness{flex:0 0 360px;align-self:flex-start;min-width:300px}.p-title>.wrxtFreshness>.block-container{margin:0}}'
          css = less.text or ''
          if extra_css not in css:
              css += extra_css
          less.text = css
          less.attrib['version_id'] = '1010770'
          less.attrib['version_string'] = '1.0.7'
          ET.indent(templates_tree, space='  ')
          templates_tree.write(templates_path, encoding='utf-8', xml_declaration=True)

          # 5) Sürüm.
          addon_json = addon / 'addon.json'
          data = json.loads(addon_json.read_text(encoding='utf-8'))
          data['version_id'] = 1010770
          data['version_string'] = '1.0.7'
          addon_json.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          # Release test metadata.
          for path in [root / 'tests/release_data.php', root / 'tests/release_static.php']:
              s = path.read_text(encoding='utf-8').replace('1010670', '1010770').replace("'1.0.6'", "'1.0.7'")
              path.write_text(s, encoding='utf-8')

          static_path = root / 'tests/release_static.php'
          s = static_path.read_text(encoding='utf-8')
          s = s.replace("foreach (['fa-chart-line', 'fa-folder-tree', 'fa-sliders'] as $icon)", "foreach (['fa-history', 'fa-chart-line', 'fa-comments', 'fa-cog'] as $icon)")
          marker = 'echo "OK\\n";'
          checks = '''$voteService = (string)file_get_contents($addon . '/Service/ThreadFreshness/Vote.php');
          if (str_contains($threadEntity, "hasPermission('wrxtFreshness', 'changeVote')") || str_contains($voteService, "hasPermission('wrxtFreshness', 'changeVote')"))
          {
              throw new RuntimeException('Vote changing is still restricted by legacy changeVote permission');
          }
          $widgetJsSource = (string)file_get_contents($widgetJs);
          if (!str_contains($widgetJsSource, 'title.appendChild(widget)') || !str_contains($widgetJsSource, "title.insertAdjacentElement('afterend', widget)"))
          {
              throw new RuntimeException('Desktop title-row / mobile below-title placement is missing');
          }

          '''
          if checks not in s:
              s = s.replace(marker, checks + marker)
          static_path.write_text(s, encoding='utf-8')

          # Docs.
          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('**1.0.6 Stable - Belirgin Kontroller**', '**1.0.7 Stable - Başlık Hizası ve Oy Değiştirme**')
          r = r.replace('XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.6.zip', 'XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.7.zip')
          r = r.replace('/releases/download/v1.0.6/', '/releases/download/v1.0.7/')
          r = r.replace('Bu paket resmi **1.0.6 Stable** sürümüdür.', 'Bu paket resmi **1.0.7 Stable** sürümüdür.')
          readme.write_text(r, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          c = changelog.read_text(encoding='utf-8')
          head = '# Değişiklik Günlüğü\n\n'
          section = '''## 1.0.7 Stable - Başlık Hizası ve Oy Değiştirme\n\n- Masaüstünde konu güncellik paneli konu başlığıyla aynı satırda sağ tarafa hizalandı.\n- Mobilde panel başlığın hemen altında tam genişlikte kalacak şekilde responsive yerleşim güncellendi.\n- Kullanıcıların aynı doğrulama döngüsünde kendi oylarını daha sonra değiştirebilmesi sağlandı.\n- ACP ana başlık ve alt menü ikonları XenForo çekirdeğinde bulunan uyumlu Font Awesome ikonlarıyla değiştirildi.\n\n'''
          if c.startswith(head) and section not in c:
              c = head + section + c[len(head):]
          changelog.write_text(c, encoding='utf-8')
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Commit 1.0.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness upload/js/warext/thread_freshness.js tests/release_static.php tests/release_data.php README.md CHANGELOG.md
          git commit -m 'v1.0.7: align widget with title and allow vote changes'
          git push
