name: Nihai Paket ve GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - 'upload/src/addons/WarextStudios/ThreadFreshness/addon.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Sürümü oku
        id: meta
        shell: bash
        run: |
          VERSION=$(php -r '$j=json_decode(file_get_contents("upload/src/addons/WarextStudios/ThreadFreshness/addon.json"), true); echo $j["version_string"] ?? "";')
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: PHP lint
        run: find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Testler
        run: |
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Kurulum paketini hazırla
        run: |
          php tools/prepare_release.php
          cd build/release
          zip -qr "../${{ steps.meta.outputs.zip }}" .
          cd ../..
          unzip -t "build/${{ steps.meta.outputs.zip }}"
          unzip -Z1 "build/${{ steps.meta.outputs.zip }}" | grep -q '^upload/'
          unzip -Z1 "build/${{ steps.meta.outputs.zip }}" | grep -q '^upload/src/addons/WarextStudios/ThreadFreshness/addon.json$'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: build/${{ steps.meta.outputs.zip }}
          if-no-files-found: error

      - name: GitHub Release yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          ZIP: build/${{ steps.meta.outputs.zip }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<EOF
# Warext Studios | Konu Güncellik Sistemi ${VERSION}

XenForo 2.3 için topluluk tabanlı konu ve çözüm güncellik doğrulama sistemi.

- Çalıştı / çalışmadı topluluk oylaması ve oy değiştirme
- Forum bazlı bekleme süresi ve güncellik yaş hesabı
- Sürüm bazlı doğrulama sonuçları ve olumsuz oy nedenleri
- Güncel alternatif konu önerileri ve konu sahibinin hâlâ geçerli bildirimi
- Zaman ağırlıklı durum motoru ve ACP üzerinden değiştirilebilir eşikler
- Otomatik yeniden doğrulama, moderatör doğrulaması ve web push bildirimleri
- Konu listesi rozetleri, durum filtreleri ve Güncel Çözümler arama sayfası
- XenForo Job/cron tabanlı bakım, eşzamanlı oy kilitleme ve orphan kayıt temizliği

Kurulum paketi XenForo ACP → Add-ons → Install/upgrade from archive alanından doğrudan yüklenebilir. Manuel SQL gerekmez.

---

## English

# Warext Studios | Thread Freshness System ${VERSION}

A community-driven thread and solution freshness-verification system for XenForo 2.3.

- Works / does not work community voting with vote changes
- Per-forum waiting periods and freshness-age calculation
- Version-based verification results and negative-vote reasons
- Suggestions for up-to-date alternative threads and a non-binding still-valid declaration by the thread owner
- Time-weighted status engine with ACP-configurable thresholds
- Automatic revalidation, moderator verification and web-push notifications
- Thread-list badges, status filters and an Up-to-date Solutions search page
- XenForo Job/cron-based maintenance, concurrent-vote locking and orphan-record cleanup

The installation package can be uploaded directly through XenForo ACP → Add-ons → Install/upgrade from archive. No manual SQL is required.
EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Warext Studios Konu Güncellik $VERSION" --notes-file /tmp/release-notes.md
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "Warext Studios Konu Güncellik $VERSION" --notes-file /tmp/release-notes.md
          fi
