name: ThreadFreshness 1.0.7 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-107-final.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply 1.0.7
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/thread-freshness-107-fix.yml').read_text(encoding='utf-8')
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          code = source.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code = code.replace("t2, n = pattern.subn(\"\\n\\n        // Çözümün durumu zamanla değişebileceği için uygun kullanıcı kendi oyunu güncelleyebilir.\\n        return true;\", t, count=1)", "t2, n = pattern.subn(\"\\n\\n        return true;\", t, count=1)")
          exec(compile(code, '<thread-freshness-107-final>', 'exec'), {})
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Commit 1.0.7
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness upload/js/warext/thread_freshness.js tests/release_static.php tests/release_data.php README.md CHANGELOG.md
          git commit -m 'v1.0.7: align widget with title and allow vote changes'
          git push
