name: ThreadFreshness UI 1.0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-106.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply v1.0.6 redesign
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          addon = root / 'upload/src/addons/WarextStudios/ThreadFreshness'
          mods_path = addon / '_data/template_modifications.xml'
          templates_path = addon / '_data/templates.xml'
          nav_path = addon / '_data/admin_navigation.xml'
          js_path = root / 'upload/js/warext/thread_freshness.js'

          mods = mods_path.read_text(encoding='utf-8')

          mods = mods.replace(
              '&lt;div class="wrxtFreshness" id="wrxt-thread-freshness"&gt;',
              '&lt;div class="wrxtFreshness" id="wrxt-thread-freshness" style="width:100%;max-width:360px;margin:8px 0 12px auto;"&gt;'
          )

          mods = mods.replace(
              '&lt;summary title="Bu sistem ne işe yarar?" aria-label="Bu sistem ne işe yarar?"&gt;?&lt;/summary&gt;',
              '&lt;summary class="button button--link wrxtFreshness-toolButton" title="Bu sistem ne işe yarar?" aria-label="Bu sistem ne işe yarar?"&gt;&lt;span aria-hidden="true"&gt;ⓘ&lt;/span&gt; Bilgi&lt;/summary&gt;'
          )
          mods = mods.replace(
              '&lt;summary title="İşlemler" aria-label="İşlemler"&gt;•••&lt;/summary&gt;',
              '&lt;summary class="button button--link wrxtFreshness-toolButton" title="İşlemler" aria-label="İşlemler"&gt;&lt;span aria-hidden="true"&gt;⚙&lt;/span&gt; İşlemler&lt;/summary&gt;'
          )
          mods = mods.replace(
              '&lt;summary title="Bilgi"&gt;?&lt;/summary&gt;',
              '&lt;summary class="button button--link wrxtFreshness-toolButton" title="Bilgi"&gt;&lt;span aria-hidden="true"&gt;ⓘ&lt;/span&gt; Bilgi&lt;/summary&gt;'
          )

          vote_block = r'''&lt;xf:if is="$thread.canWrxtFreshnessVote()"&gt;
              &lt;xf:form action="{{ link('threads/freshness-vote', $thread) }}" ajax="true" class="wrxtFreshness-voteForm"&gt;
                  &lt;div class="wrxtFreshness-votePrompt"&gt;
                      &lt;strong&gt;Bu çözüm sende çalıştı mı?&lt;/strong&gt;
                      &lt;span&gt;Seçimini yap, ardından oyu kaydet.&lt;/span&gt;
                  &lt;/div&gt;

                  &lt;div class="wrxtFreshness-choiceGroup" role="radiogroup" aria-label="Çözüm sonucu"&gt;
                      &lt;label class="wrxtFreshness-choice wrxtFreshness-choice--yes"&gt;
                          &lt;input class="wrxtFreshness-choiceInput" type="radio" name="vote" value="1" required="required" {{ $wrxtVisitorVote == 1 ? 'checked' : '' }} /&gt;
                          &lt;span class="button button--link wrxtFreshness-choiceSurface"&gt;
                              &lt;span class="wrxtFreshness-choiceMark" aria-hidden="true"&gt;✓&lt;/span&gt;
                              &lt;span class="wrxtFreshness-choiceText"&gt;&lt;b&gt;Çalıştı&lt;/b&gt;&lt;small&gt;Çözüm hâlâ geçerli&lt;/small&gt;&lt;/span&gt;
                          &lt;/span&gt;
                      &lt;/label&gt;
                      &lt;label class="wrxtFreshness-choice wrxtFreshness-choice--no"&gt;
                          &lt;input class="wrxtFreshness-choiceInput" type="radio" name="vote" value="-1" required="required" {{ $wrxtVisitorVote == -1 ? 'checked' : '' }} /&gt;
                          &lt;span class="button button--link wrxtFreshness-choiceSurface"&gt;
                              &lt;span class="wrxtFreshness-choiceMark" aria-hidden="true"&gt;✕&lt;/span&gt;
                              &lt;span class="wrxtFreshness-choiceText"&gt;&lt;b&gt;Çalışmadı&lt;/b&gt;&lt;small&gt;Çözüm artık geçersiz&lt;/small&gt;&lt;/span&gt;
                          &lt;/span&gt;
                      &lt;/label&gt;
                  &lt;/div&gt;

                  &lt;details class="wrxtFreshness-more wrxtFreshness-voteDetails"&gt;
                      &lt;summary class="button button--link wrxtFreshness-moreButton"&gt;＋ Oy ayrıntısı&lt;/summary&gt;
                      &lt;div class="wrxtFreshness-fields"&gt;
                          &lt;label&gt;&lt;span&gt;Sürüm&lt;/span&gt;
                              &lt;xf:if is="$wrxtVersions"&gt;
                                  &lt;xf:select name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}"&gt;
                                      &lt;xf:option value=""&gt;Seçin&lt;/xf:option&gt;
                                      &lt;xf:foreach loop="$wrxtVersions" value="$wrxtVersion"&gt;&lt;xf:option value="{$wrxtVersion}"&gt;{$wrxtVersion}&lt;/xf:option&gt;&lt;/xf:foreach&gt;
                                  &lt;/xf:select&gt;
                              &lt;xf:else /&gt;
                                  &lt;xf:textbox name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}" maxlength="100" /&gt;
                              &lt;/xf:if&gt;
                          &lt;/label&gt;
                          &lt;label&gt;&lt;span&gt;Neden&lt;/span&gt;
                              &lt;xf:select name="reason" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.reason : '' }}"&gt;
                                  &lt;xf:option value=""&gt;Seçmek istemiyorum&lt;/xf:option&gt;
                                  &lt;xf:option value="outdated_version"&gt;Yeni sürümde çalışmıyor&lt;/xf:option&gt;
                                  &lt;xf:option value="dead_links"&gt;Dosya/bağlantı çalışmıyor&lt;/xf:option&gt;
                                  &lt;xf:option value="method_invalid"&gt;Yöntem geçersiz&lt;/xf:option&gt;
                                  &lt;xf:option value="incomplete"&gt;Çözüm eksik&lt;/xf:option&gt;
                                  &lt;xf:option value="did_not_work"&gt;Sistemde çalışmadı&lt;/xf:option&gt;
                                  &lt;xf:option value="other"&gt;Diğer&lt;/xf:option&gt;
                              &lt;/xf:select&gt;
                          &lt;/label&gt;
                          &lt;label&gt;&lt;span&gt;Açıklama&lt;/span&gt;&lt;xf:textbox name="message" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.message : '' }}" maxlength="500" /&gt;&lt;/label&gt;
                          &lt;label&gt;&lt;span&gt;Güncel konu ID&lt;/span&gt;&lt;xf:numberbox name="alternative_thread_id" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.alternative_thread_id : 0 }}" min="0" /&gt;&lt;/label&gt;
                      &lt;/div&gt;
                  &lt;/details&gt;

                  &lt;div class="wrxtFreshness-saveBar"&gt;
                      &lt;span class="wrxtFreshness-saveHint"&gt;Oy, Kaydet butonuna bastığınızda işlenir.&lt;/span&gt;
                      &lt;xf:button type="submit" class="button--primary wrxtFreshness-saveButton"&gt;Oyu kaydet&lt;/xf:button&gt;
                  &lt;/div&gt;
              &lt;/xf:form&gt;
          &lt;/xf:if&gt;'''

          start = mods.find('&lt;xf:if is="$thread.canWrxtFreshnessVote()"&gt;')
          end_marker = '\n\n          &lt;xf:if is="$wrxtReasonSummary OR $wrxtVersionSummary"&gt;'
          end = mods.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Vote form block not found')
          mods = mods[:start] + vote_block + mods[end:]
          mods_path.write_text(mods, encoding='utf-8')

          css = r'''.wrxtFreshness {
    width: 100%;
    max-width: 360px;
    margin: 8px 0 12px auto;
    position: relative;
    z-index: 3;
    font-size: 13px;
}

.wrxtFreshness > .block-container {
    border: 1px solid @xf-borderColor;
    border-radius: 8px;
    background: @xf-contentBg;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    overflow: visible;
}

.wrxtFreshness-main { padding: 10px; }
.wrxtFreshness-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wrxtFreshness-heading { display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
.wrxtFreshness-title { font-size: 13px; line-height: 1.25; white-space: nowrap; }
.wrxtFreshness-heading .label { font-size: 10px; line-height: 1.25; padding: 2px 6px; }
.wrxtFreshness-icons { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }

.wrxtFreshness-pop { position: relative; }
.wrxtFreshness-pop > summary,
.wrxtFreshness-more > summary { list-style: none; cursor: pointer; }
.wrxtFreshness-pop > summary::-webkit-details-marker,
.wrxtFreshness-more > summary::-webkit-details-marker { display: none; }
.wrxtFreshness-toolButton.button,
.wrxtFreshness-moreButton.button {
    min-width: 0;
    padding: 5px 8px;
    font-size: 11px;
    line-height: 1.2;
    border-radius: 6px;
}
.wrxtFreshness-pop[open] > .wrxtFreshness-toolButton {
    border-color: @xf-linkColor;
    box-shadow: inset 0 0 0 1px @xf-linkColor;
}

.wrxtFreshness-popBody {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    width: 270px;
    padding: 10px;
    border: 1px solid @xf-borderColor;
    border-radius: 7px;
    background: @xf-contentBg;
    box-shadow: 0 7px 24px rgba(0, 0, 0, .24);
    z-index: 30;
    font-size: 12px;
}
.wrxtFreshness-popBody p { margin: 5px 0 0; color: @xf-textColorMuted; line-height: 1.4; }
.wrxtFreshness-popBody--actions form + form { margin-top: 7px; }
.wrxtFreshness-actionForm { display: flex; gap: 6px; align-items: center; }
.wrxtFreshness-actionForm .input,
.wrxtFreshness-actionForm select { min-width: 0; flex: 1 1 auto; }

.wrxtFreshness-meta {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 8px;
}
.wrxtFreshness-meta > span {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 7px;
    border: 1px solid @xf-borderColor;
    border-radius: 999px;
    background: @xf-contentAltBg;
    color: @xf-textColorMuted;
    font-size: 11px;
}
.wrxtFreshness-meta b { color: @xf-textColor; }
.wrxtFreshness-ownerBadge { color: @xf-linkColor !important; }
.wrxtFreshness-replacement { margin-top: 8px; font-size: 12px; }

.wrxtFreshness-voteForm {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid @xf-borderColor;
}
.wrxtFreshness-votePrompt { display: flex; flex-direction: column; gap: 2px; margin-bottom: 7px; }
.wrxtFreshness-votePrompt strong { font-size: 12px; }
.wrxtFreshness-votePrompt span { color: @xf-textColorMuted; font-size: 11px; }

.wrxtFreshness-choiceGroup {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 7px;
}
.wrxtFreshness-choice { position: relative; display: block; min-width: 0; cursor: pointer; }
.wrxtFreshness-choiceInput {
    position: absolute;
    opacity: 0;
    width: 1px;
    height: 1px;
    pointer-events: none;
}
.wrxtFreshness-choiceSurface.button {
    width: 100%;
    min-height: 49px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    padding: 7px 8px;
    text-align: left;
    white-space: normal;
    border-radius: 7px;
    border: 1px solid @xf-borderColor;
    background: @xf-contentAltBg;
    color: @xf-textColor;
    box-shadow: none;
    transition: border-color .12s ease, background .12s ease, box-shadow .12s ease, transform .12s ease;
}
.wrxtFreshness-choice:hover .wrxtFreshness-choiceSurface { border-color: @xf-linkColor; transform: translateY(-1px); }
.wrxtFreshness-choiceInput:focus + .wrxtFreshness-choiceSurface { box-shadow: 0 0 0 2px fade(@xf-linkColor, 22%); }
.wrxtFreshness-choiceMark {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 25px;
    border: 1px solid @xf-borderColor;
    background: @xf-contentBg;
    font-weight: 700;
}
.wrxtFreshness-choiceText { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; }
.wrxtFreshness-choiceText b { font-size: 12px; }
.wrxtFreshness-choiceText small { margin-top: 2px; color: @xf-textColorMuted; font-size: 9px; }

.wrxtFreshness-choice--yes .wrxtFreshness-choiceInput:checked + .wrxtFreshness-choiceSurface {
    border-color: #43a047;
    background: fade(#43a047, 16%);
    box-shadow: inset 0 0 0 1px fade(#43a047, 45%);
}
.wrxtFreshness-choice--yes .wrxtFreshness-choiceInput:checked + .wrxtFreshness-choiceSurface .wrxtFreshness-choiceMark {
    border-color: #43a047;
    background: #43a047;
    color: #fff;
}
.wrxtFreshness-choice--no .wrxtFreshness-choiceInput:checked + .wrxtFreshness-choiceSurface {
    border-color: #d9534f;
    background: fade(#d9534f, 15%);
    box-shadow: inset 0 0 0 1px fade(#d9534f, 42%);
}
.wrxtFreshness-choice--no .wrxtFreshness-choiceInput:checked + .wrxtFreshness-choiceSurface .wrxtFreshness-choiceMark {
    border-color: #d9534f;
    background: #d9534f;
    color: #fff;
}

.wrxtFreshness-voteDetails { margin-top: 7px; }
.wrxtFreshness-moreButton.button { display: inline-flex; }
.wrxtFreshness-fields,
.wrxtFreshness-resultsBody {
    margin-top: 7px;
    padding: 8px;
    border: 1px solid @xf-borderColor;
    border-radius: 7px;
    background: @xf-contentAltBg;
}
.wrxtFreshness-fields { display: grid; gap: 7px; }
.wrxtFreshness-fields label { display: grid; gap: 3px; }
.wrxtFreshness-fields label > span { color: @xf-textColorMuted; font-size: 10px; }

.wrxtFreshness-saveBar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid @xf-borderColor;
}
.wrxtFreshness-saveHint { max-width: 170px; color: @xf-textColorMuted; font-size: 10px; line-height: 1.25; }
.wrxtFreshness-saveButton.button { min-width: 105px; padding-left: 12px; padding-right: 12px; }

.wrxtFreshness-more { margin-top: 7px; }
.wrxtFreshness-resultsBody strong { display: block; margin: 6px 0 3px; font-size: 11px; }
.wrxtFreshness-main--waiting { padding: 9px 10px; }

@media (max-width: @xf-responsiveMedium) {
    .wrxtFreshness {
        width: 100%;
        max-width: none;
        margin: 7px 0 10px;
    }
    .wrxtFreshness-popBody {
        position: fixed;
        left: 12px;
        right: 12px;
        top: auto;
        width: auto;
    }
}

@media (max-width: 420px) {
    .wrxtFreshness-choiceText small { display: none; }
    .wrxtFreshness-choiceSurface.button { min-height: 43px; padding: 6px 7px; }
    .wrxtFreshness-saveHint { display: none; }
    .wrxtFreshness-saveButton.button { width: 100%; }
}'''

          templates = templates_path.read_text(encoding='utf-8')
          pat = re.compile(r'<template type="public" title="wrxt_thread_freshness\.less" version_id="\d+" version_string="[^"]+">.*?</template>', re.S)
          replacement = '<template type="public" title="wrxt_thread_freshness.less" version_id="1010670" version_string="1.0.6">' + css + '</template>'
          templates, count = pat.subn(replacement, templates, count=1)
          if count != 1:
              raise SystemExit(f'Freshness LESS template replacement failed: {count}')
          templates_path.write_text(templates, encoding='utf-8')

          js_path.write_text(r'''(function () {
    'use strict';

    function applyResponsiveSize(widget) {
        if (!widget) {
            return;
        }

        if (window.matchMedia && window.matchMedia('(max-width: 650px)').matches) {
            widget.style.width = '100%';
            widget.style.maxWidth = 'none';
            widget.style.marginLeft = '0';
            widget.style.marginRight = '0';
        } else {
            widget.style.width = '100%';
            widget.style.maxWidth = '360px';
            widget.style.marginLeft = 'auto';
            widget.style.marginRight = '0';
        }
    }

    function placeFreshnessWidget() {
        var widget = document.getElementById('wrxt-thread-freshness');
        if (!widget) {
            return;
        }

        var title = document.querySelector('.p-title');
        if (title && title.parentNode && widget.dataset.wrxtPlaced !== '1') {
            title.insertAdjacentElement('afterend', widget);
            widget.dataset.wrxtPlaced = '1';
        }

        applyResponsiveSize(widget);
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', placeFreshnessWidget, { once: true });
    } else {
        placeFreshnessWidget();
    }

    window.addEventListener('load', placeFreshnessWidget, { once: true });
    window.addEventListener('resize', placeFreshnessWidget);
}());
''', encoding='utf-8')

          nav = nav_path.read_text(encoding='utf-8')
          nav = nav.replace('navigation_id="wrxtThreadFreshnessDashboard" parent_navigation_id="wrxtThreadFreshness" display_order="10" link="thread-freshness"', 'navigation_id="wrxtThreadFreshnessDashboard" parent_navigation_id="wrxtThreadFreshness" display_order="10" link="thread-freshness" icon="fa-chart-line"')
          nav = nav.replace('navigation_id="wrxtThreadFreshnessForums" parent_navigation_id="wrxtThreadFreshness" display_order="20" link="thread-freshness/forums"', 'navigation_id="wrxtThreadFreshnessForums" parent_navigation_id="wrxtThreadFreshness" display_order="20" link="thread-freshness/forums" icon="fa-folder-tree"')
          nav = nav.replace('navigation_id="wrxtThreadFreshnessSettings" parent_navigation_id="wrxtThreadFreshness" display_order="30" link="thread-freshness/settings"', 'navigation_id="wrxtThreadFreshnessSettings" parent_navigation_id="wrxtThreadFreshness" display_order="30" link="thread-freshness/settings" icon="fa-sliders"')
          nav_path.write_text(nav, encoding='utf-8')

          meta_path = addon / 'addon.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['version_id'] = 1010670
          meta['version_string'] = '1.0.6'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          for p in [root / 'tests/release_static.php', root / 'tests/release_data.php']:
              t = p.read_text(encoding='utf-8').replace('1010570', '1010670').replace("'1.0.5'", "'1.0.6'")
              p.write_text(t, encoding='utf-8')

          release_static = root / 'tests/release_static.php'
          rs = release_static.read_text(encoding='utf-8')
          guard = r'''
if (!str_contains($mods, 'wrxtFreshness-choiceSurface') || !str_contains($mods, 'Oyu kaydet') || !str_contains($mods, 'required="required"'))
{
    throw new RuntimeException('Two-step selectable vote UI is missing');
}
if (!str_contains($mods, 'wrxtFreshness-toolButton') || !str_contains($mods, 'İşlemler'))
{
    throw new RuntimeException('Explicit widget tool buttons are missing');
}
foreach (['fa-chart-line', 'fa-folder-tree', 'fa-sliders'] as $icon)
{
    if (!str_contains($adminNav, $icon))
    {
        throw new RuntimeException('ACP navigation icon missing: ' . $icon);
    }
}
'''
          marker = '\necho "OK\\n";'
          if guard.strip() not in rs:
              rs = rs.replace(marker, guard + marker)
          release_static.write_text(rs, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          head = '# Değişiklik Günlüğü\n\n'
          section = '''## 1.0.6 Stable - Oylama Arayüzü Yenilemesi\n\n- Çalıştı / Çalışmadı aksiyonları anında oy gönderen düğmeler olmaktan çıkarıldı; seçilebilir ve seçildiğinde içi dolan iki seçenekli kontrol yapısına geçirildi.\n- Oyun gönderilmesi için ayrı bir “Oyu kaydet” butonu eklendi.\n- Oy ayrıntıları ayrı ikincil buton altında tutuldu; panel normal durumda kompakt kaldı.\n- Bilgi ve İşlemler kontrolleri gerçek XenForo buton sınıflarıyla görünür hale getirildi; ham soru işareti / üç nokta görünümü kaldırıldı.\n- Widget genişliği JavaScript ve inline güvence ile masaüstünde kompakt, mobilde tam genişlik olacak şekilde sağlamlaştırıldı.\n- ACP Konu Güncellik Sistemi alt menülerine Genel Bakış, Forum/Kategori Ayarları ve Ayarlar ikonları eklendi.\n\n'''
          if old.startswith(head) and '## 1.0.6 Stable' not in old:
              changelog.write_text(head + section + old[len(head):], encoding='utf-8')

          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('**1.0.5 Stable', '**1.0.6 Stable')
          r = r.replace('XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.5.zip', 'XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.6.zip')
          r = r.replace('/releases/download/v1.0.5/', '/releases/download/v1.0.6/')
          r = r.replace('**1.0.5 Stable**', '**1.0.6 Stable**')
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Commit v1.0.6
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml upload/src/addons/WarextStudios/ThreadFreshness/_data/admin_navigation.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json upload/js/warext/thread_freshness.js tests/release_static.php tests/release_data.php CHANGELOG.md README.md
          git commit -m 'v1.0.6: redesign selectable vote controls and ACP icons'
          git push
