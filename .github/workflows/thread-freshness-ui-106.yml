name: ThreadFreshness UI 1.0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-106.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply v1.0.6 redesign
        run: python3 tools/thread_freshness_ui_106.py

      - name: Update regression guard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('tests/release_static.php')
          s = p.read_text(encoding='utf-8')
          old = "if (!str_contains($mods, 'wrxtFreshness-voteButtons') || !str_contains($mods, 'wrxtFreshness-help') || !str_contains($mods, 'warext/thread_freshness.js'))"
          new = "if ((!str_contains($mods, 'wrxtFreshness-voteButtons') && !str_contains($mods, 'wrxtFreshness-choiceSurface')) || !str_contains($mods, 'wrxtFreshness-help') || !str_contains($mods, 'warext/thread_freshness.js'))"
          if old not in s:
              raise SystemExit('responsive widget guard not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Commit v1.0.6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml upload/src/addons/WarextStudios/ThreadFreshness/_data/admin_navigation.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json upload/js/warext/thread_freshness.js tests/release_static.php tests/release_data.php CHANGELOG.md README.md
          git commit -m 'v1.0.6: redesign selectable vote controls and ACP icons'
          git push
