name: ThreadFreshness UI 1.0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-104.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply micro voting widget
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html, json, re

          root = Path('.')
          addon = root / 'upload/src/addons/WarextStudios/ThreadFreshness'
          mods_path = addon / '_data/template_modifications.xml'
          templates_path = addon / '_data/templates.xml'

          widget = r'''<xf:if is="$thread.isWrxtFreshnessEnabled()">
    <xf:css src="wrxt_thread_freshness.less" />
    <xf:js src="warext/thread_freshness.js" />
    <xf:set var="$wrxtState" value="{$thread.getWrxtFreshnessState()}" />
    <xf:set var="$wrxtStateCurrent" value="{$thread.isWrxtFreshnessStateCurrent()}" />
    <xf:set var="$wrxtDisplayStatus" value="{$thread.getWrxtFreshnessDisplayStatus()}" />
    <xf:set var="$wrxtVisitorVote" value="{$thread.getWrxtFreshnessVisitorVote()}" />
    <xf:set var="$wrxtVoteEntity" value="{$thread.getWrxtFreshnessVisitorVoteEntity()}" />
    <xf:set var="$wrxtVersions" value="{$thread.getWrxtFreshnessConfiguredVersions()}" />
    <xf:set var="$wrxtVersionSummary" value="{$thread.getWrxtFreshnessVersionSummary()}" />
    <xf:set var="$wrxtReasonSummary" value="{$thread.getWrxtFreshnessFailureReasonSummary()}" />
    <xf:set var="$wrxtReplacement" value="{$thread.getWrxtFreshnessReplacementThread()}" />
    <xf:set var="$wrxtSuggestions" value="{$thread.getWrxtFreshnessAlternativeSuggestions()}" />

    <div class="wrxtFreshness" id="wrxt-thread-freshness">
        <div class="block-container">
            <xf:if is="$thread.isWrxtFreshnessEligible()">
                <div class="wrxtFreshness-main">
                    <div class="wrxtFreshness-top">
                        <div class="wrxtFreshness-heading">
                            <strong class="wrxtFreshness-title">Çözüm güncelliği</strong>
                            <xf:if is="$wrxtStateCurrent AND $wrxtState">
                                <xf:if is="$wrxtDisplayStatus == 'current'"><span class="label label--green">Güncel</span>
                                <xf:elseif is="$wrxtDisplayStatus == 'likely_current'" /><span class="label label--olive">Muhtemelen güncel</span>
                                <xf:elseif is="$wrxtDisplayStatus == 'mixed'" /><span class="label label--yellow">Kararsız</span>
                                <xf:elseif is="$wrxtDisplayStatus == 'questionable'" /><span class="label label--orange">Şüpheli</span>
                                <xf:elseif is="$wrxtDisplayStatus == 'not_working'" /><span class="label label--red">Çalışmıyor</span>
                                <xf:elseif is="$wrxtDisplayStatus == 'revalidating'" /><span class="label label--blue">Yeniden doğrulanıyor</span>
                                <xf:else /><span class="label">Doğrulanmamış</span></xf:if>
                            <xf:else />
                                <span class="label">Doğrulanmamış</span>
                            </xf:if>
                        </div>
                        <div class="wrxtFreshness-icons">
                            <details class="wrxtFreshness-pop wrxtFreshness-help">
                                <summary title="Bu sistem ne işe yarar?" aria-label="Bu sistem ne işe yarar?">?</summary>
                                <div class="wrxtFreshness-popBody">
                                    <strong>Bu çözüm hâlâ geçerli mi?</strong>
                                    <p>Konu güncellik eşiğini geçti. Çözümü gerçekten denediyseniz sonucu bildirin.</p>
                                    <p>Konu sahibi ve moderatör doğrulamaları topluluk oylarıyla birlikte değerlendirilir.</p>
                                </div>
                            </details>
                            <xf:if is="$thread.canWrxtFreshnessOwnerClaim() OR $thread.canWrxtFreshnessModerate() OR $thread.canWrxtFreshnessManageReplacement()">
                                <details class="wrxtFreshness-pop wrxtFreshness-actions">
                                    <summary title="İşlemler" aria-label="İşlemler">•••</summary>
                                    <div class="wrxtFreshness-popBody wrxtFreshness-popBody--actions">
                                        <xf:if is="$thread.canWrxtFreshnessOwnerClaim()">
                                            <xf:form action="{{ link('threads/freshness-owner-claim', $thread) }}" ajax="true">
                                                <xf:hiddenval name="claimed">{{ $thread.hasWrxtFreshnessOwnerClaim() ? 0 : 1 }}</xf:hiddenval>
                                                <xf:button type="submit" class="button--link">{{ $thread.hasWrxtFreshnessOwnerClaim() ? 'Doğrulamayı kaldır' : 'Konu sahibi: hâlâ geçerli' }}</xf:button>
                                            </xf:form>
                                        </xf:if>
                                        <xf:if is="$thread.canWrxtFreshnessModerate()">
                                            <xf:set var="$wrxtModState" value="{$thread.getWrxtFreshnessState()}" />
                                            <xf:form action="{{ link('threads/freshness-moderate', $thread) }}" ajax="true" class="wrxtFreshness-actionForm">
                                                <xf:select name="moderator_status" value="{{ $wrxtModState ? $wrxtModState.moderator_status : '' }}">
                                                    <xf:option value="">Topluluk sonucunu kullan</xf:option>
                                                    <xf:option value="current">Moderatör: güncel</xf:option>
                                                    <xf:option value="review">Kontrol gerekli</xf:option>
                                                    <xf:option value="not_working">Moderatör: çalışmıyor</xf:option>
                                                </xf:select>
                                                <xf:button type="submit">Kaydet</xf:button>
                                            </xf:form>
                                        </xf:if>
                                        <xf:if is="$thread.canWrxtFreshnessManageReplacement()">
                                            <xf:form action="{{ link('threads/freshness-replacement', $thread) }}" ajax="true" class="wrxtFreshness-actionForm">
                                                <xf:numberbox name="replacement_thread_id" value="{{ $thread.getWrxtFreshnessState() ? $thread.getWrxtFreshnessState().replacement_thread_id : 0 }}" min="0" />
                                                <xf:button type="submit">Güncel konu</xf:button>
                                            </xf:form>
                                        </xf:if>
                                    </div>
                                </details>
                            </xf:if>
                        </div>
                    </div>

                    <div class="wrxtFreshness-meta">
                        <xf:if is="$wrxtStateCurrent AND $wrxtState">
                            <span><b>{$wrxtState.positive_count}</b> ✓</span>
                            <span><b>{$wrxtState.negative_count}</b> ✕</span>
                            <span>{$wrxtState.vote_count} oy</span>
                        <xf:else />
                            <span>Henüz oy yok</span>
                        </xf:if>
                        <xf:if is="$thread.hasWrxtFreshnessOwnerClaim()"><span class="wrxtFreshness-ownerBadge">Sahibi doğruladı</span></xf:if>
                    </div>

                    <xf:if is="$wrxtReplacement">
                        <div class="wrxtFreshness-replacement"><a href="{{ link('threads', $wrxtReplacement) }}">Daha güncel çözümü aç</a></div>
                    </xf:if>

                    <xf:if is="$thread.canWrxtFreshnessVote()">
                        <xf:form action="{{ link('threads/freshness-vote', $thread) }}" ajax="true" class="wrxtFreshness-voteForm">
                            <div class="wrxtFreshness-voteButtons">
                                <xf:button type="submit" name="vote" value="1" class="button--primary">✓ Çalıştı</xf:button>
                                <xf:button type="submit" name="vote" value="-1">✕ Çalışmadı</xf:button>
                            </div>
                            <details class="wrxtFreshness-more">
                                <summary>Oy ayrıntısı</summary>
                                <div class="wrxtFreshness-fields">
                                    <label><span>Sürüm</span>
                                        <xf:if is="$wrxtVersions">
                                            <xf:select name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}">
                                                <xf:option value="">Seçin</xf:option>
                                                <xf:foreach loop="$wrxtVersions" value="$wrxtVersion"><xf:option value="{$wrxtVersion}">{$wrxtVersion}</xf:option></xf:foreach>
                                            </xf:select>
                                        <xf:else />
                                            <xf:textbox name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}" maxlength="100" />
                                        </xf:if>
                                    </label>
                                    <label><span>Neden</span>
                                        <xf:select name="reason" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.reason : '' }}">
                                            <xf:option value="">Seçmek istemiyorum</xf:option>
                                            <xf:option value="outdated_version">Yeni sürümde çalışmıyor</xf:option>
                                            <xf:option value="dead_links">Dosya/bağlantı çalışmıyor</xf:option>
                                            <xf:option value="method_invalid">Yöntem geçersiz</xf:option>
                                            <xf:option value="incomplete">Çözüm eksik</xf:option>
                                            <xf:option value="did_not_work">Sistemde çalışmadı</xf:option>
                                            <xf:option value="other">Diğer</xf:option>
                                        </xf:select>
                                    </label>
                                    <label><span>Açıklama</span><xf:textbox name="message" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.message : '' }}" maxlength="500" /></label>
                                    <label><span>Güncel konu ID</span><xf:numberbox name="alternative_thread_id" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.alternative_thread_id : 0 }}" min="0" /></label>
                                </div>
                            </details>
                        </xf:form>
                    </xf:if>

                    <xf:if is="$wrxtReasonSummary OR $wrxtVersionSummary">
                        <details class="wrxtFreshness-more">
                            <summary>Sonuç ayrıntıları</summary>
                            <div class="wrxtFreshness-resultsBody">
                                <xf:if is="$wrxtReasonSummary">
                                    <strong>Çalışmama nedenleri</strong>
                                    <xf:foreach loop="$wrxtReasonSummary" key="$wrxtReason" value="$wrxtReasonTotal"><div class="pairs pairs--justified"><span>{$wrxtReason}</span><b>{$wrxtReasonTotal|number}</b></div></xf:foreach>
                                </xf:if>
                                <xf:if is="$wrxtVersionSummary">
                                    <strong>Sürüm sonuçları</strong>
                                    <xf:foreach loop="$wrxtVersionSummary" value="$wrxtVersionRow"><div class="pairs pairs--justified"><span>{$wrxtVersionRow.version}</span><span>{$wrxtVersionRow.positive_count} / {$wrxtVersionRow.negative_count}</span></div></xf:foreach>
                                </xf:if>
                            </div>
                        </details>
                    </xf:if>
                </div>
            <xf:else />
                <div class="wrxtFreshness-main wrxtFreshness-main--waiting">
                    <div class="wrxtFreshness-top">
                        <div class="wrxtFreshness-heading"><strong class="wrxtFreshness-title">Güncellik oylaması</strong><span class="label">{$thread.getWrxtFreshnessDaysUntilEligible()} gün</span></div>
                        <details class="wrxtFreshness-pop wrxtFreshness-help">
                            <summary title="Bilgi">?</summary>
                            <div class="wrxtFreshness-popBody"><strong>Henüz açılmadı</strong><p>Oy verme açılış tarihi: <xf:date time="{$thread.getWrxtFreshnessEligibleDate()}" /></p></div>
                        </details>
                    </div>
                </div>
            </xf:if>
        </div>
    </div>
</xf:if>
$0'''

          less = r'''.wrxtFreshness {
    width: min(100%, 310px);
    margin: 6px 0 10px auto;
    position: relative;
    z-index: 2;

    > .block-container {
        border-radius: 6px;
        overflow: visible;
        box-shadow: none;
    }
}

.wrxtFreshness-main { padding: 8px 10px; }
.wrxtFreshness-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.wrxtFreshness-heading { display: flex; align-items: center; gap: 6px; min-width: 0; }
.wrxtFreshness-title { font-size: 13px; line-height: 1.2; white-space: nowrap; }
.wrxtFreshness-heading .label { font-size: 10px; line-height: 1.25; padding: 2px 5px; }
.wrxtFreshness-icons { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }

.wrxtFreshness-pop { position: relative; margin: 0; }
.wrxtFreshness-pop > summary {
    list-style: none;
    width: 22px;
    height: 22px;
    border: 1px solid @xf-borderColor;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    color: @xf-textColorMuted;
    font-size: 11px;
    line-height: 1;
    user-select: none;
}
.wrxtFreshness-pop > summary::-webkit-details-marker { display: none; }
.wrxtFreshness-actions > summary { width: 28px; border-radius: 11px; letter-spacing: 1px; }
.wrxtFreshness-popBody {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    width: 260px;
    padding: 10px;
    border: 1px solid @xf-borderColor;
    border-radius: 6px;
    background: @xf-contentBg;
    box-shadow: 0 5px 18px rgba(0, 0, 0, .22);
    z-index: 20;
    font-size: 12px;
}
.wrxtFreshness-popBody p { margin: 5px 0 0; color: @xf-textColorMuted; line-height: 1.35; }
.wrxtFreshness-popBody--actions { display: grid; gap: 8px; }
.wrxtFreshness-popBody--actions form { margin: 0; }
.wrxtFreshness-actionForm { display: flex; gap: 5px; align-items: center; }
.wrxtFreshness-actionForm .input, .wrxtFreshness-actionForm select { min-width: 0; font-size: 12px; }
.wrxtFreshness-actionForm .button { white-space: nowrap; }

.wrxtFreshness-meta {
    display: flex;
    gap: 9px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 5px;
    color: @xf-textColorMuted;
    font-size: 11px;
    line-height: 1.3;
}
.wrxtFreshness-ownerBadge { color: @xf-textColorFeature; }
.wrxtFreshness-replacement { margin-top: 5px; font-size: 11px; }

.wrxtFreshness-voteForm { margin-top: 7px; }
.wrxtFreshness-voteButtons { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.wrxtFreshness-voteButtons .button { padding: 4px 7px; min-height: 28px; font-size: 11px; }

.wrxtFreshness-more { margin-top: 5px; font-size: 11px; }
.wrxtFreshness-more > summary { cursor: pointer; color: @xf-textColorMuted; }
.wrxtFreshness-fields, .wrxtFreshness-resultsBody { display: grid; gap: 7px; margin-top: 7px; }
.wrxtFreshness-fields label { display: grid; gap: 3px; }
.wrxtFreshness-fields label > span { color: @xf-textColorMuted; }
.wrxtFreshness-fields .input, .wrxtFreshness-fields select { width: 100%; font-size: 12px; }
.wrxtFreshness-main--waiting { padding-top: 7px; padding-bottom: 7px; }

@media (max-width: @xf-responsiveMedium) {
    .wrxtFreshness {
        width: 100%;
        margin: 7px 0 10px;
    }
    .wrxtFreshness-main { padding: 8px 9px; }
    .wrxtFreshness-popBody { position: fixed; left: 12px; right: 12px; top: auto; width: auto; }
}
'''

          mods_text = mods_path.read_text(encoding='utf-8')
          pattern = re.compile(r'(<modification[^>]+modification_key="wrxt_thread_freshness_thread_view"[^>]*>.*?<replace>)(.*?)(</replace>\s*</modification>)', re.S)
          escaped_widget = html.escape(widget, quote=False)
          mods_text, count = pattern.subn(lambda m: m.group(1) + escaped_widget + m.group(3), mods_text, count=1)
          if count != 1:
              raise SystemExit(f'thread view modification replacement failed: {count}')

          for key in ['wrxt_thread_freshness_moderator', 'wrxt_thread_freshness_replacement']:
              mods_text, count = re.subn(
                  r'(<modification[^>]+modification_key="' + re.escape(key) + r'"[^>]*enabled=")1("[^>]*>)',
                  r'\g<1>0\2', mods_text, count=1
              )
              if count != 1:
                  raise SystemExit(f'could not disable legacy modification: {key}')
          mods_path.write_text(mods_text, encoding='utf-8')

          templates_text = templates_path.read_text(encoding='utf-8')
          escaped_less = html.escape(less, quote=False)
          tpl_pattern = re.compile(r'<template type="public" title="wrxt_thread_freshness\.less"[^>]*>.*?</template>', re.S)
          new_tpl = '<template type="public" title="wrxt_thread_freshness.less" version_id="1010470" version_string="1.0.4">' + escaped_less + '</template>'
          if tpl_pattern.search(templates_text):
              templates_text = tpl_pattern.sub(new_tpl, templates_text, count=1)
          else:
              templates_text = templates_text.replace('</templates>', '  ' + new_tpl + '\n</templates>')
          templates_path.write_text(templates_text, encoding='utf-8')

          meta_path = addon / 'addon.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['version_id'] = 1010470
          meta['version_string'] = '1.0.4'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          for path in (root / 'tests').glob('*.php'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('1010370', '1010470').replace("'1.0.3'", "'1.0.4'")
              path.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          head = '# Değişiklik Günlüğü\n\n'
          section = '''## 1.0.4 Stable - Mikro Oylama Kartı\n\n- Masaüstü güncellik kartı 310px genişliğinde mikro karta indirildi.\n- Varsayılan görünüm yalnızca durum, çok kısa oy özeti ve gerekiyorsa iki oy butonunu gösteriyor.\n- Oy kullanamayan üyelerde gereksiz “şartları karşılamıyorsunuz” satırı kaldırıldı.\n- Konu sahibi doğrulaması küçük “Sahibi doğruladı” durumuna dönüştürüldü; kaldırma işlemi üç nokta menüsüne taşındı.\n- Bilgi metni soru işareti açılır penceresinde tutuldu.\n- Moderatör, güncel konu ve konu sahibi işlemleri ayrı bir büyük Yönetim satırı yerine üç nokta açılır menüsüne taşındı.\n- Sonuç ayrıntıları yalnızca gerçekten neden/sürüm sonucu bulunduğunda görünür.\n- Mobil görünüm konu başlığının altında tam genişlikte, düşük yükseklikte devam eder.\n\n'''
          if old.startswith(head):
              changelog.write_text(head + section + old[len(head):], encoding='utf-8')

          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('**1.0.3 Stable - Kompakt Yan Oylama Paneli**', '**1.0.4 Stable - Mikro Oylama Kartı**')
          r = r.replace('**1.0.3 Stable -', '**1.0.4 Stable - Mikro Oylama Kartı**\n\n<!-- previous:') if False else r
          r = r.replace('XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.3.zip', 'XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.4.zip')
          r = r.replace('/releases/download/v1.0.3/', '/releases/download/v1.0.4/')
          r = r.replace('Bu paket resmi **1.0.3 Stable** sürümüdür.', 'Bu paket resmi **1.0.4 Stable** sürümüdür.')
          r = re.sub(r'\*\*1\.0\.3 Stable[^\n]*\*\*', '**1.0.4 Stable - Mikro Oylama Kartı**', r, count=1)
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml"); if(!$x){exit(1);} echo "XML OK\n";'
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml"); if(!$x){exit(1);} echo "Templates XML OK\n";'

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json tests CHANGELOG.md README.md
          git commit -m 'v1.0.4: shrink freshness widget to micro card'
          git push
