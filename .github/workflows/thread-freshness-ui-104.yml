name: ThreadFreshness UI 1.0.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-104.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply micro voting widget
        shell: bash
        run: |
          git show HEAD^^:.github/workflows/thread-freshness-ui-104.yml > /tmp/thread-freshness-ui-104-source.yml
          python3 <<'PY'
          from pathlib import Path
          old = Path('/tmp/thread-freshness-ui-104-source.yml').read_text(encoding='utf-8')
          start = "          python3 <<'PY'\n"
          end = "\n          PY\n"
          code = old.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code.splitlines())
          code = code.replace("              if count != 1:\n                  raise SystemExit(f'could not disable legacy modification: {key}')", "              if count == 0 and f'modification_key=\"{key}\"' not in mods_text:\n                  raise SystemExit(f'legacy modification missing: {key}')")
          exec(compile(code, '<thread-freshness-ui-104>', 'exec'), {})
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml"); if(!$x){exit(1);} echo "XML OK\n";'
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml"); if(!$x){exit(1);} echo "Templates XML OK\n";'

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json tests CHANGELOG.md README.md
          git commit -m 'v1.0.4: shrink freshness widget to micro card'
          git push
