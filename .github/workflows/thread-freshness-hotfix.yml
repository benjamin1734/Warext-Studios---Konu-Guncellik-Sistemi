name: ThreadFreshness Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply fixes
        run: python3 tools/hotfix_101.py

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Build package
        run: |
          php tools/prepare_release.php
          cd build/release
          zip -qr ../XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip .
          cd ../..
          unzip -t build/XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip
          unzip -Z1 build/XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip | grep -q '^upload/'
          unzip -Z1 build/XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip | grep -q '^upload/src/addons/WarextStudios/ThreadFreshness/addon.json$'
          cp build/XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip
          cp build/XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip releases/Warext-Studios-Konu-Guncellik-Sistemi-1.0.1.zip

      - name: Commit update
        run: |
          rm -f .github/workflows/thread-freshness-hotfix.yml tools/hotfix_101.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v1.0.1: hata düzeltmeleri ve yeni paket'
          git push origin HEAD:main
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.1 XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip --target "$FINAL_SHA" --title 'Warext Studios Konu Güncellik 1.0.1' --notes 'Kritik hata düzeltmeleri, ACP kayıt kararlılığı, kompakt konu sahibi doğrulama butonu ve sürüm yükseltmesi.'
