name: ThreadFreshness UI 1.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/thread-freshness-ui-102.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply compact UI redesign
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          addon = root / 'upload/src/addons/WarextStudios/ThreadFreshness'
          mods_path = addon / '_data/template_modifications.xml'
          text = mods_path.read_text(encoding='utf-8')

          replacement = r'''&lt;xf:set var="$wrxtReplacement" value="{$thread.getWrxtFreshnessReplacementThread()}" /&gt;
&lt;xf:set var="$wrxtSuggestions" value="{$thread.getWrxtFreshnessAlternativeSuggestions()}" /&gt;
&lt;xf:if is="$wrxtReplacement OR $thread.canWrxtFreshnessManageReplacement()"&gt;
    &lt;div class="block" id="wrxt-thread-freshness-replacement" style="max-width:760px; margin:14px auto;"&gt;
        &lt;div class="block-container"&gt;
            &lt;div class="block-row" style="display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap;"&gt;
                &lt;div style="min-width:220px; flex:1 1 320px;"&gt;
                    &lt;div style="font-size:17px; font-weight:600; margin-bottom:4px;"&gt;Güncel çözüm&lt;/div&gt;
                    &lt;xf:if is="$wrxtReplacement"&gt;
                        &lt;div&gt;Daha güncel konu: &lt;a href="{{ link('threads', $wrxtReplacement) }}"&gt;&lt;strong&gt;{$wrxtReplacement.title}&lt;/strong&gt;&lt;/a&gt;&lt;/div&gt;
                    &lt;xf:else /&gt;
                        &lt;div class="formRow-explain"&gt;Bu konu için henüz daha güncel bir çözüm tanımlanmadı.&lt;/div&gt;
                    &lt;/xf:if&gt;
                &lt;/div&gt;
                &lt;xf:if is="$thread.canWrxtFreshnessManageReplacement()"&gt;
                    &lt;xf:form action="{{ link('threads/freshness-replacement', $thread) }}" ajax="true" style="margin:0;"&gt;
                        &lt;div class="inputGroup" style="width:260px; max-width:100%;"&gt;
                            &lt;xf:numberbox name="replacement_thread_id" value="{{ $thread.getWrxtFreshnessState() ? $thread.getWrxtFreshnessState().replacement_thread_id : 0 }}" min="0" /&gt;
                            &lt;span class="inputGroup-splitter"&gt;&lt;/span&gt;
                            &lt;xf:button type="submit" class="button--primary"&gt;Kaydet&lt;/xf:button&gt;
                        &lt;/div&gt;
                        &lt;div class="formRow-explain" style="margin-top:5px;"&gt;Konu ID · 0 yönlendirmeyi kaldırır&lt;/div&gt;
                    &lt;/xf:form&gt;
                &lt;/xf:if&gt;
            &lt;/div&gt;
            &lt;xf:if is="$wrxtSuggestions"&gt;
                &lt;div class="block-row block-row--minor"&gt;
                    &lt;strong&gt;Topluluk önerileri&lt;/strong&gt;
                    &lt;xf:foreach loop="$wrxtSuggestions" value="$wrxtSuggestion"&gt;
                        &lt;span style="display:inline-block; margin:4px 10px 0 0;"&gt;&lt;a href="{{ link('threads', $wrxtSuggestion.thread) }}"&gt;{$wrxtSuggestion.thread.title}&lt;/a&gt; &lt;span class="formRow-explain"&gt;({$wrxtSuggestion.total|number})&lt;/span&gt;&lt;/span&gt;
                    &lt;/xf:foreach&gt;
                &lt;/div&gt;
            &lt;/xf:if&gt;
        &lt;/div&gt;
    &lt;/div&gt;
&lt;/xf:if&gt;
$0'''

          freshness = r'''&lt;xf:if is="$thread.isWrxtFreshnessEnabled()"&gt;
    &lt;xf:if is="$thread.isWrxtFreshnessEligible()"&gt;
    &lt;xf:set var="$wrxtState" value="{$thread.getWrxtFreshnessState()}" /&gt;
    &lt;xf:set var="$wrxtStateCurrent" value="{$thread.isWrxtFreshnessStateCurrent()}" /&gt;
    &lt;xf:set var="$wrxtDisplayStatus" value="{$thread.getWrxtFreshnessDisplayStatus()}" /&gt;
    &lt;xf:set var="$wrxtVisitorVote" value="{$thread.getWrxtFreshnessVisitorVote()}" /&gt;
    &lt;xf:set var="$wrxtVoteEntity" value="{$thread.getWrxtFreshnessVisitorVoteEntity()}" /&gt;
    &lt;xf:set var="$wrxtVersions" value="{$thread.getWrxtFreshnessConfiguredVersions()}" /&gt;
    &lt;xf:set var="$wrxtVersionSummary" value="{$thread.getWrxtFreshnessVersionSummary()}" /&gt;
    &lt;xf:set var="$wrxtReasonSummary" value="{$thread.getWrxtFreshnessFailureReasonSummary()}" /&gt;
    &lt;div class="block" id="wrxt-thread-freshness" style="max-width:760px; margin:14px auto;"&gt;
        &lt;div class="block-container"&gt;
            &lt;div class="block-row" style="display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap;"&gt;
                &lt;div style="min-width:240px; flex:1 1 360px;"&gt;
                    &lt;div style="font-size:17px; font-weight:600; margin-bottom:3px;"&gt;Bu çözüm hâlâ geçerli mi?&lt;/div&gt;
                    &lt;div class="formRow-explain"&gt;Konu güncellik eşiğini geçti. Yalnızca çözümü gerçekten denediyseniz sonucu bildirin.&lt;/div&gt;
                &lt;/div&gt;
                &lt;div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;"&gt;
                    &lt;xf:if is="$wrxtStateCurrent AND $wrxtState"&gt;
                        &lt;xf:if is="$wrxtDisplayStatus == 'current'"&gt;&lt;span class="label label--green"&gt;Güncel&lt;/span&gt;
                        &lt;xf:elseif is="$wrxtDisplayStatus == 'likely_current'" /&gt;&lt;span class="label label--olive"&gt;Muhtemelen güncel&lt;/span&gt;
                        &lt;xf:elseif is="$wrxtDisplayStatus == 'mixed'" /&gt;&lt;span class="label label--yellow"&gt;Kararsız&lt;/span&gt;
                        &lt;xf:elseif is="$wrxtDisplayStatus == 'questionable'" /&gt;&lt;span class="label label--orange"&gt;Şüpheli&lt;/span&gt;
                        &lt;xf:elseif is="$wrxtDisplayStatus == 'not_working'" /&gt;&lt;span class="label label--red"&gt;Çalışmıyor&lt;/span&gt;
                        &lt;xf:elseif is="$wrxtDisplayStatus == 'revalidating'" /&gt;&lt;span class="label label--blue"&gt;Yeniden doğrulanıyor&lt;/span&gt;
                        &lt;xf:else /&gt;&lt;span class="label"&gt;Doğrulanmamış&lt;/span&gt;&lt;/xf:if&gt;
                    &lt;xf:else /&gt;
                        &lt;span class="label"&gt;Doğrulanmamış&lt;/span&gt;
                    &lt;/xf:if&gt;
                    &lt;xf:if is="$thread.canWrxtFreshnessOwnerClaim()"&gt;
                        &lt;xf:form action="{{ link('threads/freshness-owner-claim', $thread) }}" ajax="true" style="margin:0;"&gt;
                            &lt;xf:hiddenval name="claimed"&gt;{{ $thread.hasWrxtFreshnessOwnerClaim() ? 0 : 1 }}&lt;/xf:hiddenval&gt;
                            &lt;xf:button type="submit" class="button--primary"&gt;{{ $thread.hasWrxtFreshnessOwnerClaim() ? 'Doğrulamayı kaldır' : 'Konu sahibi: geçerli' }}&lt;/xf:button&gt;
                        &lt;/xf:form&gt;
                    &lt;/xf:if&gt;
                &lt;/div&gt;
            &lt;/div&gt;
            &lt;xf:if is="$wrxtStateCurrent AND $wrxtState"&gt;
                &lt;div class="block-row block-row--minor" style="display:flex; gap:16px; flex-wrap:wrap;"&gt;
                    &lt;span&gt;&lt;strong&gt;{$wrxtState.positive_count}&lt;/strong&gt; çalıştı&lt;/span&gt;
                    &lt;span&gt;&lt;strong&gt;{$wrxtState.negative_count}&lt;/strong&gt; çalışmadı&lt;/span&gt;
                    &lt;span&gt;&lt;strong&gt;{$wrxtState.vote_count}&lt;/strong&gt; toplam oy&lt;/span&gt;
                    &lt;xf:if is="$wrxtState.last_verified_date"&gt;&lt;span class="formRow-explain"&gt;Son doğrulama: &lt;xf:date time="$wrxtState.last_verified_date" /&gt;&lt;/span&gt;&lt;/xf:if&gt;
                &lt;/div&gt;
            &lt;/xf:if&gt;
            &lt;xf:if is="$thread.hasWrxtFreshnessOwnerClaim()"&gt;
                &lt;div class="block-row block-row--minor formRow-explain"&gt;Konu sahibi çözümün hâlâ geçerli olduğunu bildirdi; topluluk oylarının yerini almaz.&lt;/div&gt;
            &lt;/xf:if&gt;
            &lt;xf:if is="$wrxtReasonSummary OR $wrxtVersionSummary"&gt;
                &lt;details class="block-row block-row--minor"&gt;
                    &lt;summary style="cursor:pointer; font-weight:600;"&gt;Doğrulama ayrıntıları&lt;/summary&gt;
                    &lt;xf:if is="$wrxtReasonSummary"&gt;
                        &lt;div style="margin-top:8px;"&gt;&lt;strong&gt;Çalışmama nedenleri&lt;/strong&gt;
                        &lt;xf:foreach loop="$wrxtReasonSummary" key="$wrxtReason" value="$wrxtReasonTotal"&gt;
                            &lt;div class="pairs pairs--justified"&gt;&lt;span&gt;
                                &lt;xf:if is="$wrxtReason == 'outdated_version'"&gt;Yeni sürümde çalışmıyor
                                &lt;xf:elseif is="$wrxtReason == 'dead_links'" /&gt;Dosya veya bağlantılar çalışmıyor
                                &lt;xf:elseif is="$wrxtReason == 'method_invalid'" /&gt;Yöntem artık geçerli değil
                                &lt;xf:elseif is="$wrxtReason == 'incomplete'" /&gt;Çözüm eksik
                                &lt;xf:elseif is="$wrxtReason == 'did_not_work'" /&gt;Sistemde çalışmadı
                                &lt;xf:else /&gt;Diğer&lt;/xf:if&gt;
                            &lt;/span&gt;&lt;strong&gt;{$wrxtReasonTotal|number}&lt;/strong&gt;&lt;/div&gt;
                        &lt;/xf:foreach&gt;&lt;/div&gt;
                    &lt;/xf:if&gt;
                    &lt;xf:if is="$wrxtVersionSummary"&gt;
                        &lt;div style="margin-top:8px;"&gt;&lt;strong&gt;Sürüm bazlı sonuçlar&lt;/strong&gt;
                        &lt;xf:foreach loop="$wrxtVersionSummary" value="$wrxtVersionRow"&gt;
                            &lt;div class="pairs pairs--justified"&gt;&lt;span&gt;{$wrxtVersionRow.version}&lt;/span&gt;&lt;span&gt;{$wrxtVersionRow.positive_count} çalıştı / {$wrxtVersionRow.negative_count} çalışmadı&lt;/span&gt;&lt;/div&gt;
                        &lt;/xf:foreach&gt;&lt;/div&gt;
                    &lt;/xf:if&gt;
                &lt;/details&gt;
            &lt;/xf:if&gt;
            &lt;xf:if is="$thread.canWrxtFreshnessVote()"&gt;
                &lt;details class="block-row" open="open"&gt;
                    &lt;summary style="cursor:pointer; font-weight:600; margin-bottom:8px;"&gt;Sonucu bildir&lt;/summary&gt;
                    &lt;xf:form action="{{ link('threads/freshness-vote', $thread) }}" ajax="true"&gt;
                        &lt;xf:if is="$wrxtVersions"&gt;
                            &lt;xf:selectrow name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}" label="Denediğiniz sürüm"&gt;
                                &lt;xf:option value=""&gt;Sürüm seçin&lt;/xf:option&gt;
                                &lt;xf:foreach loop="$wrxtVersions" value="$wrxtVersion"&gt;&lt;xf:option value="{$wrxtVersion}"&gt;{$wrxtVersion}&lt;/xf:option&gt;&lt;/xf:foreach&gt;
                            &lt;/xf:selectrow&gt;
                        &lt;xf:else /&gt;
                            &lt;xf:textboxrow name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}" maxlength="100" label="Denediğiniz sürüm" /&gt;
                        &lt;/xf:if&gt;
                        &lt;xf:selectrow name="reason" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.reason : '' }}" label="Çalışmama nedeni"&gt;
                            &lt;xf:option value=""&gt;Seçmek istemiyorum&lt;/xf:option&gt;
                            &lt;xf:option value="outdated_version"&gt;Yeni sürümde çalışmıyor&lt;/xf:option&gt;
                            &lt;xf:option value="dead_links"&gt;Dosya veya bağlantılar çalışmıyor&lt;/xf:option&gt;
                            &lt;xf:option value="method_invalid"&gt;Yöntem artık geçerli değil&lt;/xf:option&gt;
                            &lt;xf:option value="incomplete"&gt;Çözüm eksik&lt;/xf:option&gt;
                            &lt;xf:option value="did_not_work"&gt;Benim sistemimde çalışmadı&lt;/xf:option&gt;
                            &lt;xf:option value="other"&gt;Diğer&lt;/xf:option&gt;
                        &lt;/xf:selectrow&gt;
                        &lt;xf:textboxrow name="message" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.message : '' }}" maxlength="500" label="Kısa açıklama" /&gt;
                        &lt;xf:numberboxrow name="alternative_thread_id" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.alternative_thread_id : 0 }}" min="0" label="Daha güncel konu ID (isteğe bağlı)" explain="Yalnızca çalışmadı oyunda kullanılır. 0 bırakırsanız öneri gönderilmez." /&gt;
                        &lt;div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;"&gt;
                            &lt;xf:button type="submit" name="vote" value="1" class="button--primary"&gt;Denedim, çalıştı&lt;/xf:button&gt;
                            &lt;xf:button type="submit" name="vote" value="-1"&gt;Denedim, çalışmadı&lt;/xf:button&gt;
                        &lt;/div&gt;
                        &lt;xf:if is="$wrxtVisitorVote == 1"&gt;&lt;div class="formRow-explain" style="margin-top:6px;"&gt;Mevcut oyunuz: çalıştı&lt;/div&gt;
                        &lt;xf:elseif is="$wrxtVisitorVote == -1" /&gt;&lt;div class="formRow-explain" style="margin-top:6px;"&gt;Mevcut oyunuz: çalışmadı&lt;/div&gt;&lt;/xf:if&gt;
                    &lt;/xf:form&gt;
                &lt;/details&gt;
            &lt;xf:elseif is="$wrxtVisitorVote" /&gt;
                &lt;div class="block-row block-row--minor formRow-explain"&gt;Bu doğrulama döngüsünde oyunuzu kullandınız ve oy değiştirme yetkiniz yok.&lt;/div&gt;
            &lt;xf:else /&gt;
                &lt;div class="block-row block-row--minor formRow-explain"&gt;Bu konu için oy kullanma şartlarını karşılamıyorsunuz.&lt;/div&gt;
            &lt;/xf:if&gt;
        &lt;/div&gt;
    &lt;/div&gt;
    &lt;xf:else /&gt;
        &lt;div class="block" id="wrxt-thread-freshness" style="max-width:760px; margin:14px auto;"&gt;
            &lt;div class="block-container"&gt;
                &lt;div class="block-row" style="display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;"&gt;
                    &lt;div&gt;
                        &lt;div style="font-size:17px; font-weight:600;"&gt;Konu güncellik doğrulaması&lt;/div&gt;
                        &lt;div class="formRow-explain"&gt;Oy verme, konu güncellik eşiğine ulaştığında açılır.&lt;/div&gt;
                    &lt;/div&gt;
                    &lt;span class="label"&gt;{$thread.getWrxtFreshnessDaysUntilEligible()} gün kaldı&lt;/span&gt;
                &lt;/div&gt;
                &lt;div class="block-row block-row--minor formRow-explain"&gt;Eşik: {$thread.Forum.wrxt_freshness_days} gün · Açılış: &lt;xf:date time="{$thread.getWrxtFreshnessEligibleDate()}" /&gt;&lt;/div&gt;
            &lt;/div&gt;
        &lt;/div&gt;
    &lt;/xf:if&gt;
&lt;/xf:if&gt;
$0'''

          def replace_mod(src, key, body):
              pattern = re.compile(r'(<modification[^>]+modification_key="' + re.escape(key) + r'"[^>]*>.*?<replace>)(.*?)(</replace>\s*</modification>)', re.S)
              out, count = pattern.subn(lambda m: m.group(1) + body + m.group(3), src, count=1)
              if count != 1:
                  raise SystemExit(f'Could not replace modification {key}: {count}')
              return out

          text = replace_mod(text, 'wrxt_thread_freshness_replacement', replacement)
          text = replace_mod(text, 'wrxt_thread_freshness_thread_view', freshness)
          mods_path.write_text(text, encoding='utf-8')

          meta_path = addon / 'addon.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['version_id'] = 1010270
          meta['version_string'] = '1.0.2'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          for path in [root / 'tests/release_data.php', root / 'tests/release_static.php']:
              t = path.read_text(encoding='utf-8').replace('1010170', '1010270').replace('1.0.1', '1.0.2')
              path.write_text(t, encoding='utf-8')

          hotfix_test = root / 'tests/hotfix_101.php'
          if hotfix_test.exists():
              t = hotfix_test.read_text(encoding='utf-8')
              t = t.replace("'1.0.1'", "'1.0.2'").replace('1010170', '1010270')
              hotfix_test.write_text(t, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          head = '# Değişiklik Günlüğü\n\n'
          section = '''## 1.0.2 Stable - Arayüz İyileştirmesi\n\n- Konu güncellik alanı geniş mavi başlıklı panel görünümünden çıkarılarak 760px maksimum genişlikte kompakt karta dönüştürüldü.\n- Başlık, durum rozeti ve konu sahibi doğrulama aksiyonu tek satırda/toplu alanda gösteriliyor.\n- Oy istatistikleri yatay ve daha az yer kaplayan özet biçimine geçirildi.\n- Ayrıntılı sürüm ve hata nedenleri gerektiğinde açılan “Doğrulama ayrıntıları” alanına taşındı.\n- Güncel çözüm yönlendirme alanı büyük form görünümünden çıkarıldı; konu ID + Kaydet işlemi tek satırlık kompakt kontrole dönüştürüldü.\n- Ön doğrulama görünümü de aynı kompakt tasarıma uyarlandı.\n\n'''
          if not old.startswith(head):
              raise SystemExit('Unexpected changelog header')
          changelog.write_text(head + section + old[len(head):], encoding='utf-8')

          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('**1.0.1 Stable - Hata Düzeltme**', '**1.0.2 Stable - Arayüz İyileştirmesi**')
          r = r.replace('XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.1.zip', 'XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.2.zip')
          r = r.replace('/releases/download/v1.0.1/', '/releases/download/v1.0.2/')
          r = r.replace('Bu paket resmi **1.0.1 Stable** sürümüdür.', 'Bu paket resmi **1.0.2 Stable** sürümüdür.')
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/status_calculator.php
          php tests/eligibility.php
          php tests/version_summary.php
          php tests/revalidation.php
          php tests/moderator_status.php
          php tests/notification_status.php
          php tests/failure_reason.php
          php tests/template_structure.php
          php tests/security_static.php
          php tests/release_static.php
          php tests/release_data.php
          php tests/hotfix_101.php

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/template_modifications.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json tests/release_data.php tests/release_static.php tests/hotfix_101.php CHANGELOG.md README.md
          git commit -m 'v1.0.2: compact freshness UI redesign'
          git push
