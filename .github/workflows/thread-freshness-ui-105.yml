name: ThreadFreshness UI 1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-105.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply UI polish and version metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html
          import json
          import re

          root = Path('.')
          addon_root = root / 'upload/src/addons/WarextStudios/ThreadFreshness'
          templates_path = addon_root / '_data/templates.xml'
          text = templates_path.read_text(encoding='utf-8')

          pattern = re.compile(r'(<template type="public" title="wrxt_thread_freshness\.less"[^>]*>)(.*?)(</template>)', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('wrxt_thread_freshness.less template not found')

          css = html.unescape(match.group(2))
          marker = '/* v1.0.5 clearer interactive controls */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip()

          override = r'''

/* v1.0.5 clearer interactive controls */
.wrxtFreshness {
    width: 340px;
    max-width: 100%;
}

.wrxtFreshness > .block-container {
    border: 1px solid @xf-borderColor;
    border-radius: 8px;
    background: @xf-contentBg;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .12);
    overflow: visible;
}

.wrxtFreshness-main {
    padding: 9px 10px;
}

.wrxtFreshness-top {
    gap: 8px;
    align-items: center;
}

.wrxtFreshness-heading {
    flex: 1 1 auto;
    flex-wrap: wrap;
    row-gap: 4px;
}

.wrxtFreshness-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .01em;
}

.wrxtFreshness-heading .label {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 2px 7px;
    border: 1px solid @xf-borderColor;
    border-radius: 999px;
    background: rgba(127, 127, 127, .10);
    color: @xf-textColor;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
}

.wrxtFreshness-icons {
    display: flex;
    align-items: center;
    gap: 5px;
}

.wrxtFreshness-pop > summary {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    list-style: none !important;
    min-width: 54px;
    height: 28px;
    margin: 0;
    padding: 0 8px;
    border: 1px solid @xf-borderColor;
    border-radius: 7px;
    background: rgba(127, 127, 127, .10);
    color: @xf-linkColor;
    cursor: pointer;
    font-size: 0;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease, box-shadow .15s ease;
}

.wrxtFreshness-pop > summary::marker {
    content: '';
    font-size: 0;
}

.wrxtFreshness-pop > summary::-webkit-details-marker {
    display: none;
}

.wrxtFreshness-help > summary::before {
    content: '?';
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    margin-right: 5px;
    border: 1px solid currentColor;
    border-radius: 50%;
    font-size: 10px;
    line-height: 1;
}

.wrxtFreshness-help > summary::after {
    content: 'Bilgi';
    font-size: 11px;
    line-height: 1;
}

.wrxtFreshness-actions > summary {
    min-width: 72px;
}

.wrxtFreshness-actions > summary::before {
    content: '•••';
    margin-right: 5px;
    font-size: 11px;
    letter-spacing: 1px;
    line-height: 1;
}

.wrxtFreshness-actions > summary::after {
    content: 'İşlemler';
    font-size: 11px;
    line-height: 1;
}

.wrxtFreshness-pop > summary:hover,
.wrxtFreshness-pop > summary:focus-visible {
    background: rgba(127, 127, 127, .18);
    border-color: @xf-linkColor;
    outline: none;
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, .16);
}

.wrxtFreshness-pop[open] > summary {
    background: @xf-linkColor;
    border-color: @xf-linkColor;
    color: @xf-contentBg;
    transform: none;
}

.wrxtFreshness-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
    color: @xf-textColorMuted;
    font-size: 11px;
}

.wrxtFreshness-meta > span {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 7px;
    border: 1px solid @xf-borderColor;
    border-radius: 999px;
    background: rgba(127, 127, 127, .08);
    line-height: 1.2;
}

.wrxtFreshness-meta > span b {
    color: @xf-textColor;
}

.wrxtFreshness-ownerBadge {
    color: @xf-textColor;
    font-weight: 600;
}

.wrxtFreshness-voteButtons {
    gap: 6px;
}

.wrxtFreshness-voteButtons .button {
    min-height: 32px;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
    transition: transform .15s ease, box-shadow .15s ease;
}

.wrxtFreshness-voteButtons .button:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 5px rgba(0, 0, 0, .16);
}

.wrxtFreshness-more > summary {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    margin-top: 2px;
    padding: 2px 7px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
}

.wrxtFreshness-more > summary:hover {
    border-color: @xf-borderColor;
    background: rgba(127, 127, 127, .08);
    color: @xf-textColor;
}

@media (max-width: 650px) {
    .wrxtFreshness {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
    }

    .wrxtFreshness-pop > summary {
        height: 32px;
    }
}
'''
          css = css.rstrip() + override + '\n'
          escaped_css = html.escape(css, quote=False)
          opening = re.sub(r'version_id="\d+"', 'version_id="1010570"', match.group(1))
          opening = re.sub(r'version_string="[^"]+"', 'version_string="1.0.5"', opening)
          text = text[:match.start()] + opening + escaped_css + match.group(3) + text[match.end():]
          templates_path.write_text(text, encoding='utf-8')

          addon_path = addon_root / 'addon.json'
          addon = json.loads(addon_path.read_text(encoding='utf-8'))
          addon['version_id'] = 1010570
          addon['version_string'] = '1.0.5'
          addon_path.write_text(json.dumps(addon, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          release_test = root / 'tests/release_data.php'
          test_text = release_test.read_text(encoding='utf-8')
          test_text = test_text.replace("!== 1010470 || ($addon['version_string'] ?? '') !== '1.0.4'", "!== 1010570 || ($addon['version_string'] ?? '') !== '1.0.5'")
          release_test.write_text(test_text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          current = changelog.read_text(encoding='utf-8')
          heading = '# Değişiklik Günlüğü\n\n'
          section = '''## 1.0.5 Stable - Belirgin Kontroller\n\n- Yardım ve işlem alanları “Bilgi” ve “İşlemler” etiketli gerçek buton görünümüne taşındı.\n- Tarayıcının varsayılan details ok işaretleri tamamen kaldırıldı.\n- Durum, oy sayıları ve konu sahibi doğrulaması okunabilir rozet/chip yapısına geçirildi.\n- Oy butonlarının yükseklik, boşluk, köşe, hover ve gölge durumları belirginleştirildi.\n- Kart genişliği sabit genişlik + max-width modeliyle güvenilir biçimde kompakt tutuldu.\n- Mobil dokunma hedefleri büyütüldü.\n\n'''
          if current.startswith(heading) and '## 1.0.5 Stable' not in current:
              current = heading + section + current[len(heading):]
          changelog.write_text(current, encoding='utf-8')

          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.4.zip', 'XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.5.zip')
          r = r.replace('/releases/download/v1.0.4/', '/releases/download/v1.0.5/')
          r = r.replace('**1.0.4 Stable - Mikro Oylama Kartı**', '**1.0.5 Stable - Belirgin Kontroller**', 1)
          r = r.replace('Bu paket resmi **1.0.4 Stable** sürümüdür.', 'Bu paket resmi **1.0.5 Stable** sürümüdür.')
          readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/template_structure.php
          php tests/release_data.php
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml"); if(!$x){exit(1);} echo "Templates XML OK\n";'

      - name: Commit 1.0.5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json tests/release_data.php CHANGELOG.md README.md
          git commit -m 'v1.0.5: make freshness controls clearly interactive'
          git push
