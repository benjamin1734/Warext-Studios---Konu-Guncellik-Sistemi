name: ThreadFreshness UI 1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-105.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml
      - name: Apply UI polish and version metadata
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/thread-freshness-105.py
          python3 /tmp/thread-freshness-105.py
      - name: Validate
        shell: bash
        run: |
          find upload/src/addons/WarextStudios/ThreadFreshness tools tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/template_structure.php
          php tests/release_data.php
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml"); if(!$x){exit(1);} echo "Templates XML OK\n";'
      - name: Commit 1.0.5
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml upload/src/addons/WarextStudios/ThreadFreshness/addon.json tests/release_data.php CHANGELOG.md README.md
          git commit -m 'v1.0.5: make freshness controls clearly interactive'
          git push
