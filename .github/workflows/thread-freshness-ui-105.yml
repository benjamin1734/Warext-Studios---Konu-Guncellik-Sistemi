name: ThreadFreshness UI 1.0.5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/thread-freshness-ui-105.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply clearer interactive controls
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html
          import re

          root = Path('.')
          templates_path = root / 'upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml'
          text = templates_path.read_text(encoding='utf-8')

          pattern = re.compile(r'(<template type="public" title="wrxt_thread_freshness\.less"[^>]*>)(.*?)(</template>)', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('wrxt_thread_freshness.less template not found')

          css = html.unescape(match.group(2))
          marker = '/* v1.0.5 clearer interactive controls */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n'

          override = r'''

/* v1.0.5 clearer interactive controls */
.wrxtFreshness {
    width: 340px;
    max-width: 100%;
}

.wrxtFreshness > .block-container {
    border: 1px solid @xf-borderColor;
    border-radius: 8px;
    background: @xf-contentBg;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
    overflow: visible;
}

.wrxtFreshness-main {
    padding: 9px 10px;
}

.wrxtFreshness-top {
    gap: 8px;
}

.wrxtFreshness-heading {
    flex: 1 1 auto;
    flex-wrap: wrap;
    row-gap: 4px;
}

.wrxtFreshness-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .01em;
}

.wrxtFreshness-heading .label {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 2px 7px;
    border: 1px solid @xf-borderColor;
    border-radius: 999px;
    background: @xf-contentAltBg;
    color: @xf-textColor;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
}

.wrxtFreshness-icons {
    gap: 5px;
}

.wrxtFreshness-pop > summary {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    list-style: none !important;
    width: 27px;
    height: 27px;
    margin: 0;
    padding: 0;
    border: 1px solid @xf-borderColor;
    border-radius: 7px;
    background: @xf-contentAltBg;
    color: @xf-linkColor;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
    transition: background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;
}

.wrxtFreshness-pop > summary::marker {
    content: '';
    font-size: 0;
}

.wrxtFreshness-pop > summary::-webkit-details-marker {
    display: none;
}

.wrxtFreshness-pop > summary:hover,
.wrxtFreshness-pop > summary:focus-visible {
    background: @xf-contentBg;
    color: @xf-linkColor;
    outline: none;
    transform: translateY(-1px);
}

.wrxtFreshness-pop[open] > summary {
    background: @xf-linkColor;
    border-color: @xf-linkColor;
    color: @xf-contentBg;
    transform: none;
}

.wrxtFreshness-actions > summary {
    width: 34px;
    border-radius: 7px;
    letter-spacing: 1px;
}

.wrxtFreshness-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 7px;
    color: @xf-textColorMuted;
    font-size: 11px;
}

.wrxtFreshness-meta > span {
    display: inline-flex;
    align-items: center;
    min-height: 22px;
    padding: 2px 7px;
    border: 1px solid @xf-borderColor;
    border-radius: 999px;
    background: @xf-contentAltBg;
    line-height: 1.2;
}

.wrxtFreshness-meta > span b {
    color: @xf-textColor;
}

.wrxtFreshness-ownerBadge {
    color: @xf-textColor;
    font-weight: 600;
}

.wrxtFreshness-voteButtons {
    gap: 6px;
}

.wrxtFreshness-voteButtons .button {
    min-height: 32px;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10);
}

.wrxtFreshness-voteButtons .button:hover {
    transform: translateY(-1px);
}

.wrxtFreshness-more > summary {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    margin-top: 2px;
    padding: 2px 7px;
    border: 1px solid transparent;
    border-radius: 6px;
    cursor: pointer;
}

.wrxtFreshness-more > summary:hover {
    border-color: @xf-borderColor;
    background: @xf-contentAltBg;
    color: @xf-textColor;
}

@media (max-width: 650px) {
    .wrxtFreshness {
        width: 100%;
        max-width: none;
        margin-left: 0;
        margin-right: 0;
    }

    .wrxtFreshness-pop > summary {
        width: 30px;
        height: 30px;
    }

    .wrxtFreshness-actions > summary {
        width: 36px;
    }
}
'''
          css = css.rstrip() + override + '\n'
          escaped_css = html.escape(css, quote=False)

          opening = re.sub(r'version_id="\d+"', 'version_id="1010570"', match.group(1))
          opening = re.sub(r'version_string="[^"]+"', 'version_string="1.0.5"', opening)
          text = text[:match.start()] + opening + escaped_css + match.group(3) + text[match.end():]
          templates_path.write_text(text, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          if changelog.exists():
              current = changelog.read_text(encoding='utf-8')
              section = '''## 1.0.5 Stable - Belirgin Kontroller\n\n- Yardım ve işlem kontrolleri gerçek buton görünümüne taşındı; varsayılan details ok işaretleri tamamen kaldırıldı.\n- Kart genişliği tarayıcı/LESS uyumluluğu için min() yerine sabit genişlik + max-width modeliyle düzenlendi.\n- Durum, oy sayıları ve konu sahibi doğrulaması okunabilir rozet/chip yapısına geçirildi.\n- Oy butonlarının yükseklik, boşluk, köşe ve hover durumları belirginleştirildi.\n- Mobil dokunma hedefleri büyütüldü; masaüstü kart kompakt tutuldu.\n\n'''
              heading = '# Değişiklik Günlüğü\n\n'
              if current.startswith(heading) and '## 1.0.5 Stable' not in current:
                  current = heading + section + current[len(heading):]
              changelog.write_text(current, encoding='utf-8')

          readme = root / 'README.md'
          if readme.exists():
              r = readme.read_text(encoding='utf-8')
              r = r.replace('XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.4.zip', 'XenForo-ACP-Direct-Install-Warext-Konu-Guncellik-1.0.5.zip')
              r = r.replace('/releases/download/v1.0.4/', '/releases/download/v1.0.5/')
              r = r.replace('**1.0.4 Stable - Mikro Oylama Kartı**', '**1.0.5 Stable - Belirgin Kontroller**', 1)
              r = r.replace('Bu paket resmi **1.0.4 Stable** sürümüdür.', 'Bu paket resmi **1.0.5 Stable** sürümüdür.')
              readme.write_text(r, encoding='utf-8')
          PY

      - name: Validate XML and template tests
        shell: bash
        run: |
          php -r '$x=simplexml_load_file("upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml"); if(!$x){exit(1);} echo "Templates XML OK\n";'
          php tests/template_structure.php

      - name: Commit UI polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upload/src/addons/WarextStudios/ThreadFreshness/_data/templates.xml CHANGELOG.md README.md
          git commit -m 'ui: make ThreadFreshness controls clearly interactive for 1.0.5'
          git push
