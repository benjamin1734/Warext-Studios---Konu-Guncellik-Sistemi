name: Bilingual Release Notes Update

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bilingual-release-notes.yml']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v1.1.0 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.1.0'
          gh release view "$TAG" --json body --jq .body > /tmp/current.md
          cat > /tmp/en.md <<'EOF'
**Full Changelog**: https://github.com/benjamin1734/Warext-Studios---Konu-Guncellik-Sistemi/compare/v1.0.10...v1.1.0
EOF
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/current.md').read_text(encoding='utf-8').rstrip()
          marker = '\n\n---\n\n## English\n'
          if marker in base:
              base = base.split(marker, 1)[0].rstrip()
          en = Path('/tmp/en.md').read_text(encoding='utf-8').strip()
          Path('/tmp/final.md').write_text(base + marker + '\n' + en + '\n', encoding='utf-8')
          PY
          gh release edit "$TAG" --notes-file /tmp/final.md
      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/bilingual-release-notes.yml
          git commit -m 'Release notu geçici işini temizle' || exit 0
          git push || true
