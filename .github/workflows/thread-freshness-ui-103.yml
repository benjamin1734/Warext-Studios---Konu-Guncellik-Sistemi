name: ThreadFreshness UI 1.0.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/thread-freshness-ui-103.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, simplexml

      - name: Apply responsive side voting widget
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import html, json, re

          root = Path('.')
          addon = root / 'upload/src/addons/WarextStudios/ThreadFreshness'
          mods_path = addon / '_data/template_modifications.xml'
          templates_path = addon / '_data/templates.xml'

          widget = r'''<xf:if is="$thread.isWrxtFreshnessEnabled()">
    <xf:css src="wrxt_thread_freshness.less" />
    <xf:js src="warext/thread_freshness.js" />
    <xf:set var="$wrxtState" value="{$thread.getWrxtFreshnessState()}" />
    <xf:set var="$wrxtStateCurrent" value="{$thread.isWrxtFreshnessStateCurrent()}" />
    <xf:set var="$wrxtDisplayStatus" value="{$thread.getWrxtFreshnessDisplayStatus()}" />
    <xf:set var="$wrxtVisitorVote" value="{$thread.getWrxtFreshnessVisitorVote()}" />
    <xf:set var="$wrxtVoteEntity" value="{$thread.getWrxtFreshnessVisitorVoteEntity()}" />
    <xf:set var="$wrxtVersions" value="{$thread.getWrxtFreshnessConfiguredVersions()}" />
    <xf:set var="$wrxtVersionSummary" value="{$thread.getWrxtFreshnessVersionSummary()}" />
    <xf:set var="$wrxtReasonSummary" value="{$thread.getWrxtFreshnessFailureReasonSummary()}" />
    <xf:set var="$wrxtReplacement" value="{$thread.getWrxtFreshnessReplacementThread()}" />
    <xf:set var="$wrxtSuggestions" value="{$thread.getWrxtFreshnessAlternativeSuggestions()}" />

    <div class="wrxtFreshness" id="wrxt-thread-freshness">
        <div class="block-container">
            <xf:if is="$thread.isWrxtFreshnessEligible()">
                <div class="wrxtFreshness-main">
                    <div class="wrxtFreshness-head">
                        <div class="wrxtFreshness-heading">
                            <div class="wrxtFreshness-title">Bu çözüm hâlâ geçerli mi?</div>
                            <div class="wrxtFreshness-status">
                                <xf:if is="$wrxtStateCurrent AND $wrxtState">
                                    <xf:if is="$wrxtDisplayStatus == 'current'"><span class="label label--green">Güncel</span>
                                    <xf:elseif is="$wrxtDisplayStatus == 'likely_current'" /><span class="label label--olive">Muhtemelen güncel</span>
                                    <xf:elseif is="$wrxtDisplayStatus == 'mixed'" /><span class="label label--yellow">Kararsız</span>
                                    <xf:elseif is="$wrxtDisplayStatus == 'questionable'" /><span class="label label--orange">Şüpheli</span>
                                    <xf:elseif is="$wrxtDisplayStatus == 'not_working'" /><span class="label label--red">Çalışmıyor</span>
                                    <xf:elseif is="$wrxtDisplayStatus == 'revalidating'" /><span class="label label--blue">Yeniden doğrulanıyor</span>
                                    <xf:else /><span class="label">Doğrulanmamış</span></xf:if>
                                <xf:else />
                                    <span class="label">Doğrulanmamış</span>
                                </xf:if>
                            </div>
                        </div>
                        <details class="wrxtFreshness-help">
                            <summary title="Bu alan ne işe yarar?" aria-label="Bu alan ne işe yarar?">?</summary>
                            <div class="wrxtFreshness-helpBody">
                                <strong>Güncellik doğrulaması</strong>
                                <p>Bu konu belirlenen gün eşiğini geçti. Yalnızca çözümü gerçekten denediyseniz oy verin.</p>
                                <p>Topluluk oyları; konu sahibi ve moderatör doğrulamalarıyla birlikte değerlendirilir.</p>
                            </div>
                        </details>
                    </div>

                    <xf:if is="$wrxtReplacement">
                        <div class="wrxtFreshness-replacement">Güncel çözüm: <a href="{{ link('threads', $wrxtReplacement) }}"><strong>{$wrxtReplacement.title}</strong></a></div>
                    </xf:if>

                    <div class="wrxtFreshness-stats">
                        <xf:if is="$wrxtStateCurrent AND $wrxtState">
                            <span><strong>{$wrxtState.positive_count}</strong> çalıştı</span>
                            <span><strong>{$wrxtState.negative_count}</strong> çalışmadı</span>
                            <span><strong>{$wrxtState.vote_count}</strong> oy</span>
                        <xf:else />
                            <span>Henüz topluluk oyu yok</span>
                        </xf:if>
                    </div>

                    <xf:if is="$thread.canWrxtFreshnessVote()">
                        <xf:form action="{{ link('threads/freshness-vote', $thread) }}" ajax="true" class="wrxtFreshness-voteForm">
                            <div class="wrxtFreshness-voteButtons">
                                <xf:button type="submit" name="vote" value="1" class="button--primary">Çalıştı</xf:button>
                                <xf:button type="submit" name="vote" value="-1">Çalışmadı</xf:button>
                            </div>
                            <details class="wrxtFreshness-advanced">
                                <summary>İsteğe bağlı ayrıntı</summary>
                                <div class="wrxtFreshness-fields">
                                    <label>
                                        <span>Denediğiniz sürüm</span>
                                        <xf:if is="$wrxtVersions">
                                            <xf:select name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}">
                                                <xf:option value="">Sürüm seçin</xf:option>
                                                <xf:foreach loop="$wrxtVersions" value="$wrxtVersion"><xf:option value="{$wrxtVersion}">{$wrxtVersion}</xf:option></xf:foreach>
                                            </xf:select>
                                        <xf:else />
                                            <xf:textbox name="version" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.version : '' }}" maxlength="100" placeholder="Örn. 2.3.7" />
                                        </xf:if>
                                    </label>
                                    <label>
                                        <span>Çalışmama nedeni</span>
                                        <xf:select name="reason" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.reason : '' }}">
                                            <xf:option value="">Seçmek istemiyorum</xf:option>
                                            <xf:option value="outdated_version">Yeni sürümde çalışmıyor</xf:option>
                                            <xf:option value="dead_links">Dosya veya bağlantılar çalışmıyor</xf:option>
                                            <xf:option value="method_invalid">Yöntem artık geçerli değil</xf:option>
                                            <xf:option value="incomplete">Çözüm eksik</xf:option>
                                            <xf:option value="did_not_work">Benim sistemimde çalışmadı</xf:option>
                                            <xf:option value="other">Diğer</xf:option>
                                        </xf:select>
                                    </label>
                                    <label>
                                        <span>Kısa açıklama</span>
                                        <xf:textbox name="message" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.message : '' }}" maxlength="500" />
                                    </label>
                                    <label>
                                        <span>Daha güncel konu ID</span>
                                        <xf:numberbox name="alternative_thread_id" value="{{ $wrxtVoteEntity ? $wrxtVoteEntity.alternative_thread_id : 0 }}" min="0" />
                                    </label>
                                </div>
                            </details>
                            <xf:if is="$wrxtVisitorVote == 1"><div class="wrxtFreshness-note">Mevcut oyunuz: çalıştı</div>
                            <xf:elseif is="$wrxtVisitorVote == -1" /><div class="wrxtFreshness-note">Mevcut oyunuz: çalışmadı</div></xf:if>
                        </xf:form>
                    <xf:elseif is="$wrxtVisitorVote" />
                        <div class="wrxtFreshness-note">Bu doğrulama döngüsünde oyunuzu kullandınız.</div>
                    <xf:else />
                        <div class="wrxtFreshness-note">Bu konu için oy kullanma şartlarını karşılamıyorsunuz.</div>
                    </xf:if>

                    <xf:if is="$thread.canWrxtFreshnessOwnerClaim()">
                        <xf:form action="{{ link('threads/freshness-owner-claim', $thread) }}" ajax="true" class="wrxtFreshness-ownerForm">
                            <xf:hiddenval name="claimed">{{ $thread.hasWrxtFreshnessOwnerClaim() ? 0 : 1 }}</xf:hiddenval>
                            <xf:button type="submit" class="button--link">{{ $thread.hasWrxtFreshnessOwnerClaim() ? 'Doğrulamayı kaldır' : 'Konu sahibi: hâlâ geçerli' }}</xf:button>
                        </xf:form>
                    </xf:if>

                    <xf:if is="$wrxtReasonSummary OR $wrxtVersionSummary OR $thread.hasWrxtFreshnessOwnerClaim()">
                        <details class="wrxtFreshness-results">
                            <summary>Sonuç ayrıntıları</summary>
                            <div class="wrxtFreshness-resultsBody">
                                <xf:if is="$thread.hasWrxtFreshnessOwnerClaim()"><div>Konu sahibi çözümün hâlâ geçerli olduğunu bildirdi.</div></xf:if>
                                <xf:if is="$wrxtStateCurrent AND $wrxtState AND $wrxtState.last_verified_date"><div>Son doğrulama: <xf:date time="$wrxtState.last_verified_date" /></div></xf:if>
                                <xf:if is="$wrxtReasonSummary">
                                    <strong>Çalışmama nedenleri</strong>
                                    <xf:foreach loop="$wrxtReasonSummary" key="$wrxtReason" value="$wrxtReasonTotal">
                                        <div class="pairs pairs--justified"><span>
                                            <xf:if is="$wrxtReason == 'outdated_version'">Yeni sürümde çalışmıyor
                                            <xf:elseif is="$wrxtReason == 'dead_links'" />Dosya/bağlantı çalışmıyor
                                            <xf:elseif is="$wrxtReason == 'method_invalid'" />Yöntem geçersiz
                                            <xf:elseif is="$wrxtReason == 'incomplete'" />Çözüm eksik
                                            <xf:elseif is="$wrxtReason == 'did_not_work'" />Sistemde çalışmadı
                                            <xf:else />Diğer</xf:if>
                                        </span><strong>{$wrxtReasonTotal|number}</strong></div>
                                    </xf:foreach>
                                </xf:if>
                                <xf:if is="$wrxtVersionSummary">
                                    <strong>Sürüm sonuçları</strong>
                                    <xf:foreach loop="$wrxtVersionSummary" value="$wrxtVersionRow">
                                        <div class="pairs pairs--justified"><span>{$wrxtVersionRow.version}</span><span>{$wrxtVersionRow.positive_count} / {$wrxtVersionRow.negative_count}</span></div>
                                    </xf:foreach>
                                </xf:if>
                            </div>
                        </details>
                    </xf:if>
                </div>
            <xf:else />
                <div class="wrxtFreshness-main wrxtFreshness-main--waiting">
                    <div class="wrxtFreshness-head">
                        <div class="wrxtFreshness-heading">
                            <div class="wrxtFreshness-title">Güncellik oylaması</div>
                            <div class="wrxtFreshness-status"><span class="label">{$thread.getWrxtFreshnessDaysUntilEligible()} gün sonra</span></div>
                        </div>
                        <details class="wrxtFreshness-help">
                            <summary title="Bu alan ne işe yarar?" aria-label="Bu alan ne işe yarar?">?</summary>
                            <div class="wrxtFreshness-helpBody">
                                <strong>Henüz oy verilemiyor</strong>
                                <p>Bu forumda eşik {$thread.Forum.wrxt_freshness_days} gün. Oy verme açılış tarihi: <xf:date time="{$thread.getWrxtFreshnessEligibleDate()}" />.</p>
                            </div>
                        </details>
                    </div>
                </div>
            </xf:if>

            <xf:if is="$thread.canWrxtFreshnessModerate() OR $thread.canWrxtFreshnessManageReplacement() OR $wrxtSuggestions">
                <details class="wrxtFreshness-manage">
                    <summary>Yönetim</summary>
                    <div class="wrxtFreshness-manageBody">
                        <xf:if is="$thread.canWrxtFreshnessModerate()">
                            <xf:form action="{{ link('threads/freshness-moderate', $thread) }}" ajax="true" class="wrxtFreshness-manageForm">
                                <strong>Moderatör doğrulaması</strong>
                                <xf:select name="moderator_status" value="{{ $wrxtState ? $wrxtState.moderator_status : '' }}">
                                    <xf:option value="">Topluluk sonucunu kullan</xf:option>
                                    <xf:option value="current">Güncel</xf:option>
                                    <xf:option value="review">Kontrol gerekli</xf:option>
                                    <xf:option value="not_working">Çalışmıyor</xf:option>
                                </xf:select>
                                <xf:button type="submit">Kaydet</xf:button>
                            </xf:form>
                        </xf:if>
                        <xf:if is="$thread.canWrxtFreshnessManageReplacement()">
                            <xf:form action="{{ link('threads/freshness-replacement', $thread) }}" ajax="true" class="wrxtFreshness-manageForm">
                                <strong>Güncel çözüm yönlendirmesi</strong>
                                <div class="inputGroup">
                                    <xf:numberbox name="replacement_thread_id" value="{{ $wrxtState ? $wrxtState.replacement_thread_id : 0 }}" min="0" />
                                    <span class="inputGroup-splitter"></span>
                                    <xf:button type="submit">Kaydet</xf:button>
                                </div>
                                <div class="wrxtFreshness-note">0 yönlendirmeyi kaldırır.</div>
                            </xf:form>
                        </xf:if>
                        <xf:if is="$wrxtSuggestions">
                            <div class="wrxtFreshness-suggestions">
                                <strong>Topluluk önerileri</strong>
                                <xf:foreach loop="$wrxtSuggestions" value="$wrxtSuggestion">
                                    <a href="{{ link('threads', $wrxtSuggestion.thread) }}">{$wrxtSuggestion.thread.title} ({$wrxtSuggestion.total|number})</a>
                                </xf:foreach>
                            </div>
                        </xf:if>
                    </div>
                </details>
            </xf:if>
        </div>
    </div>
</xf:if>
$0'''

          css = r'''.wrxtFreshness {
    width: 350px;
    max-width: 100%;
    margin: 10px 0 16px auto;
    position: relative;
    z-index: 1;
}
.wrxtFreshness .block-container {
    border-radius: 8px;
    overflow: visible;
}
.wrxtFreshness-main {
    padding: 12px 13px 10px;
}
.wrxtFreshness-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    position: relative;
}
.wrxtFreshness-heading {
    min-width: 0;
}
.wrxtFreshness-title {
    font-size: 15px;
    font-weight: 650;
    line-height: 1.25;
}
.wrxtFreshness-status {
    margin-top: 5px;
}
.wrxtFreshness-help {
    position: relative;
    flex: 0 0 auto;
}
.wrxtFreshness-help summary,
.wrxtFreshness-results summary,
.wrxtFreshness-advanced summary,
.wrxtFreshness-manage summary {
    cursor: pointer;
}
.wrxtFreshness-help summary {
    list-style: none;
    width: 24px;
    height: 24px;
    border: 1px solid @xf-borderColor;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    color: @xf-textColorMuted;
    user-select: none;
}
.wrxtFreshness-help summary::-webkit-details-marker { display: none; }
.wrxtFreshness-helpBody {
    position: absolute;
    right: 0;
    top: 30px;
    width: 285px;
    padding: 10px 12px;
    border: 1px solid @xf-borderColor;
    border-radius: 7px;
    background: @xf-contentBg;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    z-index: 20;
    font-size: 12px;
    line-height: 1.45;
}
.wrxtFreshness-helpBody p {
    margin: 5px 0 0;
}
.wrxtFreshness-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 12px;
    margin-top: 10px;
    font-size: 12px;
    color: @xf-textColorMuted;
}
.wrxtFreshness-replacement {
    margin-top: 9px;
    padding: 7px 8px;
    border-radius: 6px;
    background: fade(@xf-linkColor, 8%);
    font-size: 12px;
}
.wrxtFreshness-voteForm {
    margin-top: 10px;
}
.wrxtFreshness-voteButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}
.wrxtFreshness-voteButtons .button {
    width: 100%;
    justify-content: center;
}
.wrxtFreshness-note {
    margin-top: 8px;
    color: @xf-textColorMuted;
    font-size: 11px;
    line-height: 1.35;
}
.wrxtFreshness-ownerForm {
    margin-top: 7px;
}
.wrxtFreshness-ownerForm .button {
    min-height: 0;
    padding: 2px 0;
    font-size: 11px;
}
.wrxtFreshness-advanced,
.wrxtFreshness-results,
.wrxtFreshness-manage {
    margin-top: 8px;
    font-size: 11px;
}
.wrxtFreshness-advanced > summary,
.wrxtFreshness-results > summary,
.wrxtFreshness-manage > summary {
    color: @xf-textColorMuted;
}
.wrxtFreshness-fields,
.wrxtFreshness-resultsBody,
.wrxtFreshness-manageBody {
    margin-top: 8px;
    display: grid;
    gap: 8px;
}
.wrxtFreshness-fields label {
    display: grid;
    gap: 4px;
}
.wrxtFreshness-fields label > span {
    color: @xf-textColorMuted;
}
.wrxtFreshness-manage {
    border-top: 1px solid @xf-borderColor;
    padding: 8px 13px 10px;
    margin-top: 0;
}
.wrxtFreshness-manageForm {
    display: grid;
    gap: 6px;
}
.wrxtFreshness-manageForm + .wrxtFreshness-manageForm {
    padding-top: 8px;
    border-top: 1px solid @xf-borderColor;
}
.wrxtFreshness-suggestions {
    display: grid;
    gap: 4px;
}
.wrxtFreshness-main--waiting {
    padding-bottom: 12px;
}
@media (max-width: 650px) {
    .wrxtFreshness {
        width: 100%;
        margin: 10px 0 14px;
    }
    .wrxtFreshness-helpBody {
        width: min(285px, calc(100vw - 42px));
    }
}
'''

          js = r'''(function () {
    'use strict';

    function placeFreshnessWidget() {
        var widget = document.getElementById('wrxt-thread-freshness');
        if (!widget || widget.dataset.wrxtPlaced === '1') {
            return;
        }

        var title = document.querySelector('.p-title');
        if (!title || !title.parentNode) {
            return;
        }

        title.insertAdjacentElement('afterend', widget);
        widget.dataset.wrxtPlaced = '1';
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', placeFreshnessWidget, { once: true });
    } else {
        placeFreshnessWidget();
    }

    window.addEventListener('load', placeFreshnessWidget, { once: true });
}());
'''

          text = mods_path.read_text(encoding='utf-8')

          def remove_mod(src, key):
              pattern = re.compile(r'\n?\s*<modification\b[^>]*modification_key="' + re.escape(key) + r'"[^>]*>.*?</modification>', re.S)
              out, count = pattern.subn('', src, count=1)
              if count != 1:
                  raise SystemExit(f'Could not remove modification {key}: {count}')
              return out

          def replace_mod(src, key, body):
              pattern = re.compile(r'(<modification\b[^>]*modification_key="' + re.escape(key) + r'"[^>]*>.*?<replace>)(.*?)(</replace>\s*</modification>)', re.S)
              escaped = html.escape(body, quote=False)
              out, count = pattern.subn(lambda m: m.group(1) + escaped + m.group(3), src, count=1)
              if count != 1:
                  raise SystemExit(f'Could not replace modification {key}: {count}')
              return out

          text = remove_mod(text, 'wrxt_thread_freshness_moderator')
          text = remove_mod(text, 'wrxt_thread_freshness_replacement')
          text = replace_mod(text, 'wrxt_thread_freshness_thread_view', widget)
          mods_path.write_text(text, encoding='utf-8')

          templates = templates_path.read_text(encoding='utf-8')
          templates = re.sub(r'\s*<template type="public" title="wrxt_thread_freshness\.less"[^>]*>.*?</template>', '', templates, flags=re.S)
          css_template = f'  <template type="public" title="wrxt_thread_freshness.less" version_id="1010370" version_string="1.0.3">{html.escape(css, quote=False)}</template>\n'
          templates = templates.replace('</templates>', css_template + '</templates>')
          templates_path.write_text(templates, encoding='utf-8')

          js_path = root / 'upload/js/warext/thread_freshness.js'
          js_path.parent.mkdir(parents=True, exist_ok=True)
          js_path.write_text(js, encoding='utf-8')

          meta_path = addon / 'addon.json'
          meta = json.loads(meta_path.read_text(encoding='utf-8'))
          meta['version_id'] = 1010370
          meta['version_string'] = '1.0.3'
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          for path in [root / 'tests/release_data.php', root / 'tests/release_static.php']:
              t = path.read_text(encoding='utf-8').replace('1010270', '1010370').replace("'1.0.2'", "'1.0.3'")
              path.write_text(t, encoding='utf-8')

          release_static = root / 'tests/release_static.php'
          t = release_static.read_text(encoding='utf-8')
          anchor = "if (!str_contains($mods, '$thread.isWrxtFreshnessEnabled()') || !str_contains($mods, 'Oy verme açılış tarihi'))\n"
          checks = '''if (!str_contains($mods, 'wrxtFreshness-voteButtons') || !str_contains($mods, 'wrxtFreshness-help') || !str_contains($mods, 'warext/thread_freshness.js'))\n{\n    throw new RuntimeException('Responsive side voting widget is missing');\n}\nif (str_contains($mods, 'modification_key="wrxt_thread_freshness_replacement"') || str_contains($mods, 'modification_key="wrxt_thread_freshness_moderator"'))\n{\n    throw new RuntimeException('Legacy standalone freshness panels still exist');\n}\n$templatesData = (string)file_get_contents($addon . '/_data/templates.xml');\nif (!str_contains($templatesData, 'wrxt_thread_freshness.less'))\n{\n    throw new RuntimeException('Freshness widget stylesheet template is missing');\n}\n$widgetJs = $root . '/upload/js/warext/thread_freshness.js';\nif (!is_file($widgetJs) || !str_contains((string)file_get_contents($widgetJs), "document.querySelector('.p-title')"))\n{\n    throw new RuntimeException('Freshness widget responsive placement script is missing');\n}\n\n'''
          if checks not in t:
              t = t.replace(anchor, checks + anchor)
          release_static.write_text(t, encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          old = changelog.read_text(encoding='utf-8')
          head = '# Değişiklik Günlüğü\n\n'
          section = '''## 1.0.3 Stable - Yan Oylama Paneli\n\n- Konu altındaki ortalanmış geniş güncellik kartı kaldırıldı; panel konu başlığı alanının sağında küçük bir oylama kartı olarak konumlandırıldı.\n- Mobil görünümde aynı kart başlığın hemen altına tam genişlikte taşınıyor.\n- “Çalıştı / Çalışmadı” oylaması iki doğrudan aksiyona indirildi; sürüm, neden, açıklama ve alternatif konu alanları isteğe bağlı ayrıntı bölümüne alındı.\n- Soru işareti üzerinden açılan kısa bilgilendirme alanı eklendi.\n- Güncel çözüm yönlendirmesi, moderatör doğrulaması ve yönetici yönlendirme araçları ayrı büyük paneller yerine aynı küçük kartın yönetim bölümüne taşındı.\n- Sonuç ve sürüm ayrıntıları varsayılan olarak kapalı tutularak konu görünümündeki görsel yük azaltıldı.\n\n'''
          if not old.startswith(head):
              raise SystemExit('Unexpected changelog header')
          changelog.write_text(head + section + old[len(head):], encoding='utf-8')

          readme = root / 'README.md'
          r = readme.read_text(encoding='utf-8')
          r = r.replace('**1.0.2 Stable - Arayüz İyileştirmesi**', '**1.0.3 Stable - Yan Oylama Paneli**')
